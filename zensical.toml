[project.theme]
# Copied from app/assets/icon/ at build time (see the docs workflow), so the
# app stays the one source of the logo.
logo = "assets/brand/revoced-mark-redacted-white-on-black.svg"
favicon = "assets/brand/revoced-mark-redacted-white-on-black.svg"
features = [
  # Top-level sections become tabs, so the sidebar holds only the section
  # the reader is in — the whole tree is never on screen at once.
  "navigation.tabs",
  "navigation.indexes",
  "navigation.prune",
  "navigation.path",
  "navigation.top",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
tables = {}
attr_list = {}
toc.permalink = true
"pymdownx.highlight" = {}
"pymdownx.tabbed" = { alternate_style = true }

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
