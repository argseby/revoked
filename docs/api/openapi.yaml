openapi: 3.1.0
info:
  title: Revoked API
  version: "0.1.0"
  summary: Secret sharing and data collection over revocable, living grants.
  description: |
    Every operator runs this API under their own domain, so there is no shared
    base URL — substitute your own host everywhere below.

    Two things distinguish this API from a typical CRUD surface, and both are
    worth reading before integrating:

    - **Grants are living.** A share resolves the current value at read time,
      so rotating a secret updates every share that points at it. Pausing or
      revoking one takes effect on the next read, not on the next sync.
    - **Public endpoints are protected by slug entropy alone.** Anything under
      `/api/public` or `/s` is reachable by whoever holds the slug. There is
      deliberately no list endpoint for them.

    Endpoints marked *unauthenticated* are meant to be called by people with no
    account on this server — recipients of a share, responders to a request,
    verifiers walking the trust chain.
  license:
    name: See repository
servers:
  - url: https://{host}
    description: Your deployment
    variables:
      host:
        default: api.example.com
        description: The domain this operator runs under, matching its DNS TXT record.

security:
  - ApiKey: []
  - Session: []

tags:
  - name: Encrypted records
    description: |
      Experimental end-to-end encrypted entries. The server stores opaque bytes
      and cannot read them; clients do all the cryptography.
  - name: Discovery
    description: |
      Unauthenticated endpoints describing the server itself. These anchor the
      DNS trust chain: a verifier reads `_revoked.<domain>` from DNS, fetches
      the root key here, and checks that the two agree before believing
      anything an identity signed.
  - name: Identity
    description: |
      Identity material and, more importantly, whether the issuer still stands
      behind it. A certificate is minted for ten years and its parent signature
      never expires, so possession proves nothing about current standing — only
      the status endpoint does.
  - name: Shares
    description: |
      Reading a share by slug. The probe reports gates without revealing data;
      the resolve returns data and consumes a view.
  - name: Requests
    description: Submitting data to a request by slug.
  - name: Invites
    description: Previewing and accepting a workspace invitation.
  - name: Workspaces
    description: Membership and account-level operations.
  - name: Records
    description: |
      The vault. Records hold the values that shares resolve at read time.
  - name: Grants
    description: Shares and requests as owned resources.
  - name: Webhooks
    description: |
      A workspace's webhook endpoints, the events they hear about, and every
      delivery and attempt, with resend, replay and test. Events name what
      changed and never carry a value. See the [Webhooks guide](../webhooks.md)
      for the event catalogue and signature check.
  - name: Contacts
    description: |
      Handing a grant to a counterparty the workspace keeps in its address
      book. The grant is always minted in the caller's own workspace, so the
      caller keeps the side they can pause and revoke. Where the contact's
      address belongs to an account on this server the grant is also put in
      that person's own tray; otherwise the slug comes back for the caller to
      pass on. Nothing is pushed to another server.
  - name: Peers
    description: |
      Calls one server makes to another when an answer to a request lives on
      the responder's own server. The responder's server holds the values and
      hands the requester's server a grant id and a token; the requester's
      server reads the grant with that token and is told by signed events when
      it changes. Every endpoint here is called by a server, not by a person,
      and every outbound call goes through the client that refuses redirects
      and private addresses.
  - name: Sign-in
    description: |
      People sign in with a passkey and nothing else; there are no passwords.
      A passkey is bound to the address it was made at, so the ceremony runs
      on this server's own page in the browser, and the app collects the
      result with a one-time code bound to a PKCE challenge. An account gets
      its first passkey by signing up (where the operator allows it) or from
      a one-time ticket the operator issues; further passkeys from a ticket a
      signed-in person issues.
  - name: OpenID Connect
    description: |
      Sign in with Revoked. A service signs people in with an ordinary
      OpenID Connect client library: the authorization code flow with PKCE,
      with the service identified by its origin and no registration. Each
      service sees its own subject for a person, so services cannot match
      their users across each other. Vault entries a service asks for are
      given as grants it reads with a token, never as copies. Every sign-in
      is approved in the Revoked app, signed with a key that stays on the
      device; there is no sign-in in the browser and no session at the
      provider.
  - name: Attestations
    description: |
      Statements one domain signs about an identity, usually one issued by
      another domain. An attestation is created as an offer; its subject
      accepts it by proving possession of an identity key, and receives a
      credential bound to that key. The credential is an SD-JWT VC: each
      claim is disclosed or withheld by its holder, and a presentation is
      bound to one verifier and one occasion. The issuer's key is certified
      by its root key, so the DNS pin anchors every credential, and a status
      list tells whether a credential still stands without the issuer
      learning who asked. Which attesters to believe is left to whoever
      verifies.
  - name: Vault
    description: |
      The vault as an API key or a connected tool reaches it. Each holds
      permissions from the catalogue (`GET /api/permissions`) and a reach:
      the sections chosen for it, or for an assistant the owner runs on their
      own machine, the whole vault. Reach is checked on every request, so a
      record taken out of a section is out of reach at once. Encrypted
      records are never served.
  - name: Connections
    description: |
      Tools the owner connected. A tool proposes shares (`revoked://p`) and,
      once connected, reads the status of the links its proposals became and
      receives the links the owner handed it. It reads the vault only where
      the owner allowed `allowVaultRead`, and stores nothing here. It is connected from the app — the owner
      authorizes, the tool exchanges a one-time code (PKCE) for a token it
      sends as `X-Revoked-Connection`. A connection lapses 90 days after the
      owner last connected the tool.

paths:
  /healthz:
    get:
      tags: [Discovery]
      summary: Liveness probe
      description: Returns `ok` when the process is serving. Used by the container healthcheck.
      security: []
      responses:
        "200":
          description: Serving.
          content:
            text/plain:
              schema: { type: string, examples: ["ok"] }

  /api/server:
    get:
      tags: [Discovery]
      summary: Server identity and domain claim
      description: |
        The server's domain claim, root public key and a freshly signed
        assertion, plus the TXT record an operator must publish.

        A verifier compares `fingerprint` against the `_revoked.<domain>` TXT
        record. They must agree; the served key alone proves nothing, since
        whoever serves the response also chooses what it says.
      security: []
      responses:
        "200":
          description: The server's claim about itself.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string, description: The domain this server claims. }
                  version:
                    type: string
                    description: |
                      The backend build identifier. Release images and source
                      builds can stamp a release or commit identifier; local
                      builds without a stamp report `dev`.
                    examples: ["v0.22.0"]
                  fingerprint: { type: string, description: SHA-256 fingerprint of the root public key. }
                  publicKey: { type: string, description: Root public key, PEM encoded. }
                  assertion: { type: object, description: A freshly signed statement of the above. }
                  txt:
                    type: object
                    description: The DNS record an operator publishes to complete the chain.
                    properties:
                      host: { type: string }
                      value: { type: string }
                  mail:
                    type: object
                    description: >-
                      Operator policy: how far this server will email a grant
                      to a contact who has no account on it. A client reads it
                      to say where a send will go before anyone sends.
                    properties:
                      recipients:
                        type: string
                        enum: [off, same-domain, trusted, all]
                        description: >-
                          `off` emails nobody. `same-domain` admits addresses
                          in this server's own `domain`. `trusted` admits a
                          domain that verifies as a Revoked peer, which proves
                          the domain and not the mailbox. `all` admits any
                          address.
                  limits:
                    type: object
                    description: Operator policy a client should respect before uploading.
                    properties:
                      maxFileSize:
                        type: integer
                        description: Largest accepted upload in bytes; `-1` means no cap.
                  attestations:
                    type: object
                    description: Operator policy on attestations.
                    properties:
                      issuing:
                        type: boolean
                        description: |
                          Whether this server issues attestations in its
                          domain's name (`ALLOW_ATTESTATIONS`). Holding and
                          verifying credentials do not depend on it.
                  twoFactor:
                    type: object
                    description: Operator policy on two-factor authentication.
                    properties:
                      required:
                        type: boolean
                        description: |
                          Whether every account must sign in with an
                          authenticator app after its passkey (`REQUIRE_2FA`).

  /api/blocked-domains:
    get:
      tags: [Discovery]
      summary: The operator's list of impersonating domains
      description: |
        The file `BLOCKED_DOMAINS_FILE` names, in the format of the
        repository's `blocked-domains.txt`. The app refuses to switch to a
        server listed here or in the project's own list; this list adds to
        that one and cannot lift an entry from it. Empty when the variable is
        unset.
      security: []
      responses:
        "200":
          description: The list, possibly empty.
          content:
            text/plain:
              schema: { type: string, examples: ["# ours\nrevoked-login.example\n"] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { description: The configured file could not be read. }

  /api/permissions:
    get:
      tags: [Discovery]
      summary: Permission catalogue
      description: |
        The permissions a member or API key can hold, and the scopes each
        expands to. Grants are stored expanded, so this is what lets a stored
        grant be named back as the permissions that were picked.

        Serving it means a client never has to hardcode scope strings and drift
        from what the server enforces.
      security: []
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }

  /api/features:
    get:
      tags: [Discovery]
      summary: Feature catalogue and invite presets
      description: |
        The parts of the app a person can choose to see, and the presets an
        invite can start a member on. A feature is a display choice stored on
        the account, never an access boundary: a client shows a feature only
        where the account chose it *and* the member holds the permission it
        names, and the server enforces the permission regardless.

        Served, like the permission catalogue, so a client never hardcodes
        the list and drifts from what the server knows.
      security: []
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items: { $ref: "#/components/schemas/Feature" }
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/FeaturePreset" }

  /api/certificate:
    get:
      tags: [Discovery]
      summary: Server certificate, public material only
      description: |
        Public key material for this server's certificate authority. The
        private half is filtered out before serialization and is never served.
      security: []
      responses:
        "200":
          description: Public view of the server certificate.
          content:
            application/json:
              schema: { type: object }

  /api/certificate/{id}:
    get:
      tags: [Identity]
      summary: One identity's public certificate
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The identity's public material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  certificate: { type: string }
                  fingerprint: { type: string }
                  parentSignature: { type: string }
                  domainAtIssue: { type: string, description: The domain this identity was issued under. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/identities/{fingerprint}/status:
    get:
      tags: [Identity]
      summary: Whether the issuer still stands behind an identity
      description: |
        This server's signed, timestamped answer about one fingerprint. It is
        the piece a certificate cannot carry, and the only thing that
        distinguishes a current holder from one who was removed.

        The answer is signed by the root key rather than trusted on TLS alone:
        the caller has already pinned that key through DNS, so the statement
        needs no separate trust in this endpoint and a proxy cannot rewrite it.

        The payload is a JSON envelope whose first field is
        `type: identity-status-v1`. That separator is load-bearing — without
        it, a signature over a bare fingerprint would itself be a forged parent
        signature, and this endpoint would be a signing oracle.

        `unknown` is not `revoked`. A restored backup answers `unknown` about
        identities that are perfectly valid, and a verifier must not treat the
        two the same.
      security: []
      parameters:
        - name: fingerprint
          in: path
          required: true
          description: Lowercase hex SHA-256 fingerprint.
          schema: { type: string }
      responses:
        "200":
          description: |
            A signed assertion. Cacheable for exactly as long as the signature
            claims validity, so a cache can never outlive the statement in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityStatusAssertion" }
        "400": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/verify-peer:
    post:
      tags: [Identity]
      summary: Walk another server's trust chain
      description: |
        Asks this server to verify a peer domain end to end — DNS TXT, served
        root key, and the peer's own answer about the identity's standing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/challenges/{scope}/{slug}:
    get:
      tags: [Identity]
      summary: Issue a handshake nonce
      description: |
        Returns a single-use nonce to sign when a share or request requires a
        proven identity, when an attestation offer is accepted (scope
        `attestation`, with the offer's token as the slug), or when a
        credential is moved to another identity (scope `reissue`, with the
        fingerprint of the identity it is bound to as the slug and the
        identity it moves to as `identityId`). The signature is submitted
        with the resolve, the response, the claim or the reissue; a spent
        nonce is refused.
      security: []
      parameters:
        - name: scope
          in: path
          required: true
          description: Which kind of grant the challenge is for.
          schema: { type: string, enum: [link, request, attestation, reissue] }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A nonce to sign.
          content:
            application/json:
              schema: { type: object }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/public/links/{slug}:
    get:
      tags: [Shares]
      summary: Probe a share
      description: |
        Reports whether a share exists and what stands between the caller and
        its data. It never returns the data itself, and it does not consume a
        view — so a client can render a password prompt or a trust panel before
        spending the one read it may be allowed.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The share's gates and the sharer's claim.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  label: { type: string }
                  status: { type: string, enum: [active, paused, revoked, expired] }
                  requiresPassword: { type: boolean }
                  requireHandshake: { type: boolean, description: Whether a proven identity is required. }
                  watermarked: { type: boolean, description: Whether served files are stamped with who they were sent to. }
                  purpose: { type: string, description: "`application` marks a rental application, which is always watermarked; empty for a plain share." }
                  identity: { type: string }
                  sharer: { $ref: "#/components/schemas/Sharer" }
                  server: { $ref: "#/components/schemas/ServerClaim" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Shares]
      summary: Resolve a share
      description: |
        Returns the share's current values and **consumes one view**. POST
        rather than GET so the password and handshake material travel in the
        body rather than in a URL that lands in logs and history.

        The view claim is atomic: if a concurrent reader takes the last
        permitted view, this request is refused rather than served.

        Values are resolved at read time, so what comes back is what the record
        holds now — not what it held when the share was created.

        An end-to-end encrypted entry comes back with `sealed: true` and no
        `value`: `sealedValue` and `sealedVersion` are the entry as members
        hold it, and `viewerWrap` is its value key wrapped for this share. The
        key to that wrap is derived from the part of the share's address after
        `#`, which never reaches the server. An entry marked `unavailable`
        carries none of the three: the share has not caught up with it. An
        encrypted entry the share holds no key for is left out.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Required when the probe reported `requiresPassword`. }
                identityId: { type: string }
                handshakeToken: { type: string }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
      responses:
        "200":
          description: The share's contents, and the view count after this read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  label: { type: string }
                  purpose: { type: string, description: "`application`, or empty for a plain share." }
                  identity: { type: string }
                  sections:
                    type: array
                    items: { type: object }
                    description: |
                      How the records are grouped: the sections the link names,
                      then each section of the owner's vault holding a record
                      the link grants, with `id`, `key`, `name` and the ids of
                      its granted `records`. A section grants nothing itself.
                  records:
                    type: array
                    description: |
                      File records carry a `downloadToken`, which already
                      carries this read's view claim — so fetching the bytes is
                      never a second claim and never claim-free.
                    items: { type: object }
                  viewCount: { type: integer }
                  watermark: { type: string, description: The stamp line; present only on a watermarked share. }
                  archiveToken:
                    type: string
                    description: |
                      Present when the share grants at least one file. Opens
                      `/api/public/links/{slug}/archive` once, within two
                      minutes, like a `downloadToken`.
        "401":
          description: The password gate refused. `link_password_required` or `link_password_invalid`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/public/links/{slug}/files/{recordId}:
    get:
      tags: [Shares]
      summary: Download a shared file
      description: |
        Serves the bytes behind a file record, authorised by the
        `downloadToken` the resolve returned.

        The token carries that resolve's view claim, so a download neither
        consumes a second view nor bypasses the cap. It is single-use and bound
        to this slug and record — it will not open a different file, and it
        will not open this one twice.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: recordId
          in: path
          required: true
          description: The file record's id, as returned by the resolve.
          schema: { type: string }
        - name: dl
          in: query
          required: true
          description: The `downloadToken` from the resolve response.
          schema: { type: string }
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: The token was missing, spent, or not for this file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/links/{slug}/archive:
    get:
      tags: [Shares]
      summary: Download every shared file as a zip
      description: |
        A zip of every file the share grants, directly or through its
        sections, authorised by the `archiveToken` the resolve returned. Like a
        `downloadToken`, it carries that resolve's view claim, is single-use
        and bound to this slug.

        On a watermarked share every entry is a stamped copy, and a file that
        cannot be stamped is left out — never included unmarked. Entries are
        named after the file, deduplicated as `name (2).pdf`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: dl
          in: query
          required: true
          description: The `archiveToken` from the resolve response.
          schema: { type: string }
      responses:
        "200":
          description: The archive, as an attachment named after the share.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: "`file_download_invalid`: the token was missing, spent, or not for this share."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "404":
          description: "`archive_empty` when no file could go in, or the share no longer exists."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /s/{slug}:
    get:
      tags: [Shares]
      summary: Human-readable share page
      description: |
        A server-rendered page for the same slug, so a recipient needs no app
        and no client code. Content negotiation also serves machine formats —
        CSV, vCard and iCal — with ETag and conditional requests, which is what
        makes a share consumable by a spreadsheet or a calendar directly.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The rendered share, in the negotiated format.
        "404": { $ref: "#/components/responses/NotFound" }

  /dav/s/{slug}/:
    get:
      tags: [Shares]
      summary: CardDAV addressbook for a share
      description: |
        A read-only, single-card addressbook so a contacts app can subscribe to
        a share and stay in sync. Gated shares — password or handshake — are
        never exposed over DAV, because the protocol has nowhere to put the
        gate.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: A DAV collection; the card is at `contact.vcf`.

  /api/public/requests/{slug}:
    get:
      tags: [Requests]
      summary: Probe a request
      description: |
        Describes what a request is asking for — its template, whether it needs
        a password, an identifier or a proven identity — plus the requester's
        identity claim so the responder can verify who is asking before
        answering.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The request's shape and the requester's claim.
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string }
                  status: { type: string }
                  requiresPassword: { type: boolean }
                  requiresIdentifier: { type: boolean }
                  requireHandshake: { type: boolean }
                  allowExtraFields: { type: boolean }
                  identityScope:
                    type: string
                    enum: [any, from_root]
                    description: Which identities the request will accept.
                  template:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateItem" }
                  requester: { $ref: "#/components/schemas/Sharer" }
                  server: { $ref: "#/components/schemas/ServerClaim" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Requests]
      summary: Submit a response
      description: |
        Answers a request. Requires an account on this server: the answer is
        minted as a revocable link in the responder's own workspace, where
        they can update or withdraw it. An unauthenticated call is refused
        with `request_account_required`. Submitting again from the same
        account updates the existing response rather than creating a second
        one.

        A responder whose account is on another server answers through that
        server instead (`POST /api/requests/remote` there), and the answer
        stays in their vault on it.

        An identity is recorded only when a challenge signature verified. A
        claimed `identityId` without one is dropped, not attributed — otherwise
        anyone could submit under someone else's name.

        If the request names a callback URL, a successful submission is POSTed
        onward to it.
      security:
        - Session: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Answers keyed by template key.
                  additionalProperties: true
                mappings:
                  type: object
                  description: |
                    Answers supplied as references to the responder's own vault
                    records rather than as literal values, so the requester
                    keeps resolving the current value. Same-server only.
                  additionalProperties: { type: string }
                senderName: { type: string }
                identifier: { type: string, description: Required when the probe reported `requiresIdentifier`. }
                password: { type: string }
                identityId: { type: string }
                handshakeToken: { type: string }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
      responses:
        "200":
          description: The submission was recorded.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/requests/remote:
    post:
      tags: [Requests]
      summary: Answer a request on another server
      description: |
        Answers a request published by another Revoked server for the person
        signed in here. The answers become entries in their vault on this
        server and a link they own, as for a request on this server; the
        other server receives the link's id and a token to read it with, and
        reads the values from here whenever it needs them. Revoking the link
        here revokes the answer there.

        `origin` is the address the request was opened at. This server reads
        the request's probe there first, checks that the server at that
        address claims the domain the address belongs to, and checks the
        answer against the published template before writing anything. If
        the other server then refuses the answer, everything written for it
        is taken back and the refusal is passed on with its own code, so a
        wrong password there reads as `request_password_invalid` here.

        For a request that requires a proven identity, the challenge comes
        from the other server (`GET /api/challenges/request/{slug}` there,
        with this server's `identityId`) and is signed on the device as
        usual. This server passes the identity's public material along; the
        other server checks it against this server's DNS-pinned root key and
        asks this server whether it still vouches for it.

        Answering the same request again updates the same link and rotates
        its token.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, slug]
              properties:
                origin:
                  type: string
                  description: |
                    The other server's address, e.g. `https://requests.example`.
                    Plain `http` is accepted only for a domain listed in
                    `PEER_OVERRIDES`.
                slug: { type: string }
                data:
                  type: object
                  description: Answers keyed by template key.
                  additionalProperties: true
                mappings:
                  type: object
                  description: Answers supplied as references to the responder's own vault entries.
                  additionalProperties: { type: string }
                senderName: { type: string }
                identifier: { type: string }
                password: { type: string }
                identityId: { type: string, description: An identity of the signed-in person on this server. }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
      responses:
        "200":
          description: The other server accepted the answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  linkId: { type: string, description: The responder's link on this server. }
                  responseId: { type: string, description: The answer's id on the other server. }
                  server: { type: string, description: The other server's domain. }
                  completed: { type: boolean }
                  updated: { type: boolean }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: |
            `remote_unreachable` when the other server could not be reached,
            `remote_server_mismatch` when it claims a different domain than
            its address, or the other server's own refusal when it failed.

  /api/public/requests/{slug}/remote:
    post:
      tags: [Peers]
      summary: Accept an answer that lives on another server
      description: |
        Called by the responder's server on behalf of a person signed in
        there. Every gate a local answer passes applies: status, password,
        identifier, and a proven identity when the request requires one.

        Instead of a session, the call carries the grant: its id on the
        responder's server and the token to read it with. This server reads
        it once before accepting, which proves the responder's server is
        reachable at the domain it claims and recognises the token, and
        yields the values the template is checked against. The values are
        passed to the request's callback URL and not stored.

        An identity is accepted only when it was issued by the relaying
        server: its fingerprint matches its certificate, that server's root
        key (tied to its domain by the DNS pin) signed the fingerprint, that
        server reports it active, and it signed this request's challenge.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, grant]
              properties:
                server: { type: string, description: The responder's server's domain. }
                grant:
                  type: object
                  properties:
                    id: { type: string }
                    token: { type: string }
                password: { type: string }
                identifier: { type: string }
                senderName: { type: string }
                identity:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    fingerprint: { type: string }
                    certificate: { type: string }
                    parentSignature: { type: string }
                    domainAtIssue: { type: string }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
      responses:
        "200":
          description: The answer was recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  responseId: { type: string }
                  completed: { type: boolean }
                  updated: { type: boolean }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`remote_unreachable`: the responder's server could not be asked for the grant."

  /api/grants/resolve:
    post:
      tags: [Peers]
      summary: Read grants in bulk
      description: |
        Reads up to 100 grants in one call, each with its own token: grants
        held by another server, and grants a service received at sign-in
        (`revoked_links`). A grant that does not exist, was not handed out
        with a token, or is presented with the wrong token answers
        `not_found`; the three cannot be told apart.

        Each answer carries an `etag`. Sending it back with the next read
        yields `notModified: true` and no values when nothing changed. Each
        answer also carries `maxAge`, the number of seconds the reader may
        keep the values before asking again (`GRANT_MAX_AGE` on this server,
        60 by default). Values are present only while the grant is `active`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              properties:
                grants:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [id, token]
                    properties:
                      id: { type: string }
                      token: { type: string }
                      etag: { type: string }
      responses:
        "200":
          description: One answer per grant asked for, in the same order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status:
                          type: string
                          enum: [active, paused, revoked, expired, not_found]
                        values:
                          type: object
                          additionalProperties: { type: string }
                        etag: { type: string }
                        maxAge: { type: integer }
                        notModified: { type: boolean }
        "400":
          description: No grants, or more than 100.
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/grants/events:
    post:
      tags: [Peers]
      summary: Receive grant events
      description: |
        Receives a batch of events from a server holding grants this server
        reads. An event names the grant, what happened (`grant.revoked`,
        `grant.changed`, `grant.expired`) and the grant's status now. It
        never carries a value; the receiver reads the grant again if it
        needs one.

        The body is the exact signed bytes (`payload`, base64url) and the
        sender's root-key signature over them (`signature`, hex). The batch
        names its sender and its audience; it is accepted only when the
        sender's root key, tied to its domain by the DNS pin, verifies the
        signature, the audience is this server, and the batch is under five
        minutes old. Events older than the status already recorded are
        ignored. Each applied event is passed on to the request's callback
        URL.

        A sender whose key cannot be fetched gets `503` and retries; one
        whose signature does not verify gets `401` and does not.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload, signature]
              properties:
                payload: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: The batch verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer, description: Events about grants this server holds. }
        "401": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`peer_key_unavailable`: the sender's key could not be checked. Retry later."

  /api/public/invites/{token}:
    get:
      tags: [Invites]
      summary: Preview an invitation
      description: |
        States what accepting would grant, which workspace it joins, and
        whether the inviter may still invite — an invitation must not outlive
        the authority that issued it. The response carries the server's own
        claim too, so the recipient can verify the domain before handing over
        an account.

        `features` lists the parts of the app the invite starts a member on
        (labelled, as in `GET /api/features`), or is `null` when the invite
        leaves that choice to the person.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What this invitation grants.
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Invites]
      summary: Accept an invitation
      description: |
        Joins the workspace with the invite's permissions. If the invite
        carries a starting feature set and the account has never chosen one,
        that set becomes the account's; a set the person chose themselves is
        never overwritten. The answer's `features` is what the account sees
        afterwards.
      security:
        - Session: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/AppError" }

  /api/workspaces/{id}/members:
    get:
      tags: [Workspaces]
      summary: List workspace members
      description: |
        Who is in the workspace and what each may do, plus what the caller may
        hand out without it being refused as escalation. Being a member is the
        only requirement to read it.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Members and the caller's grantable set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  grantable:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  canManage: { type: boolean }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }

  /api/requests/{id}/links:
    get:
      tags: [Grants]
      summary: Responses collected by a request
      description: |
        Every answer with its current values. Answers kept on this server are
        read from the responders' vaults here; answers that live on the
        responders' own servers (`remote: true`, with `server` naming it) are
        read from there, in batches per server, and kept for at most the
        `maxAge` that server allows.

        A remote answer whose server could not be asked carries
        `unreachable: true` and no values, rather than a stale copy.

        Open to the request's owner, and to members who see the request (its
        audience) and hold `responses:read`. Anyone else gets 404, or 403
        `missing_permission` inside the audience without that permission.
      security:
        - Session: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The grants this request has collected.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/AppError" }

  /api/shared/vault:
    get:
      tags: [Encrypted records]
      summary: Read the sections other members shared with you
      description: |
        The sections in the caller's active workspace that belong to other
        members and are visible to the caller: their audience is the workspace
        (or a group the caller is in) and the caller holds the vault-read
        permission. Each comes with `ownerEmail`, `audienceKind`,
        `audienceGroups`, `editing`, `canEdit` and the ids of its records, and
        those records in the collection API's form. Only records the section's
        owner created; files, aliases and request answers are left out.
        Encrypted records come as ciphertext. The same records are also open
        through the collection API, where members listed as editors can
        change them. People only.
      security:
        - Session: []
      responses:
        "200": { description: "`sections` and `records`." }
        "401": { description: Not signed in. }
        "403": { description: "An API key, or not a member." }
  /api/access/{collection}/{id}:
    get:
      tags: [Encrypted records]
      summary: Read who sees and who edits an item of the workspace
      description: |
        `collection` is `sections`, `records`, `links`, `requests`,
        `templates`, `contacts` or `attestations`. Answers only for a member who
        sees the item; anyone else gets 404. Returns `owner`, `readers` and
        `editors` (each `count`, plus `members` with `id` and `email` for the
        owner and for members who may view members), `canEdit`,
        `canChangeAudience`, and for everything but a record `audience` (`kind`: `private`,
        `workspace` or `groups`; `groups`; `editing`: `owner` or `audience`).
        People only.
      security:
        - Session: []
      parameters:
        - { name: collection, in: path, required: true, schema: { type: string, enum: [sections, records, links, requests, templates, contacts, attestations] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The item's access summary. }
        "401": { description: Not signed in. }
        "403": { description: An API key. }
        "404": { description: "`record_not_found`: missing, or not visible to the caller." }
  /api/groups:
    get:
      tags: [Encrypted records]
      summary: List the groups of the active workspace
      description: |
        Every group (`id`, `key`, `name`, `members` with `id` and `email`),
        and `canManage`: whether the caller may change them. Any member may
        list them. People only.
      security:
        - Session: []
      responses:
        "200": { description: "`groups` and `canManage`." }
        "401": { description: Not signed in. }
        "403": { description: "An API key, or not a member." }
    post:
      tags: [Encrypted records]
      summary: Create a group
      description: |
        `{name}`, 1 to 80 characters; the key is derived from it. Needs the
        permission to invite members. People only.
      security:
        - Session: []
      responses:
        "201": { description: The group. }
        "400": { description: "`group_name_invalid`." }
        "403": { description: "`missing_permission`, an API key, or not a member." }
  /api/groups/{id}:
    patch:
      tags: [Encrypted records]
      summary: Rename a group
      security:
        - Session: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The group. }
        "400": { description: "`group_name_invalid`." }
        "403": { description: "`missing_permission`." }
        "404": { description: "`group_not_found`." }
    delete:
      tags: [Encrypted records]
      summary: Delete a group
      description: |
        Items whose audience named only this group are seen by their owner
        alone from then on.
      security:
        - Session: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "403": { description: "`missing_permission`." }
        "404": { description: "`group_not_found`." }
  /api/groups/{id}/members/{user}:
    put:
      tags: [Encrypted records]
      summary: Add a member of the workspace to a group
      security:
        - Session: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The group. }
        "400": { description: "`not_workspace_member`: the user is not in this workspace." }
        "403": { description: "`missing_permission`." }
        "404": { description: "`group_not_found`." }
    delete:
      tags: [Encrypted records]
      summary: Take someone out of a group
      security:
        - Session: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The group. }
        "403": { description: "`missing_permission`." }
        "404": { description: "`group_not_found`." }
  /api/sealed/state:
    get:
      tags: [Encrypted records]
      summary: Read your device list and wrapped workspace keys
      description: |
        Experimental. The formats may change until they have been independently
        reviewed.

        Everything returned is opaque to the server. A client must verify the
        device list before trusting any of it.

        `account` is the caller's own account key, in the same shape as a
        workspace row and named `account:<user id>`, or `null` before any of
        their devices made one. Identity private keys travel under it.
      security:
        - Session: []
      responses:
        "200": { description: The caller's device list and key material. }
        "401": { description: Not signed in. }
        "403": { description: An API key cannot hold encryption keys. }
  /api/sealed/devices:
    post:
      tags: [Encrypted records]
      summary: Add to your device list and hand keys to your devices
      description: |
        Experimental. Appends signed entries and stores wrapped workspace keys,
        and copies of the caller's account key (a wrap whose `workspace` is
        `account:<user id>`), in one transaction. Every entry must follow from the list before it and be
        signed by a device on it; a session alone cannot change the list. Removing a device withdraws its wrapped keys and
        refuses encrypted writes in those workspaces until a new key epoch
        exists.

        An entry's `kind` is `device`, `recovery` or `passkey`. A `passkey` entry
        holds keys derived from a passkey's WebAuthn PRF output: it names its
        credential in `credentialId`, carries in `anchorSignature` the derived
        key's signature over `revoked-passkey-anchor-v1 ‖ user ‖ root hash ‖
        credentialId`, and is never the first entry, so it is never self-signed.
        One live entry per credential. The PRF output itself never reaches the
        server: the sign-in page hands it to the app in the fragment of the
        `revoked://auth` link, and `POST /api/passkeys/token` names the passkey
        that signed in under `meta.passkey` (`id`, `name`, `credentialId`).
      security:
        - Session: []
      responses:
        "200": { description: Saved. }
        "400": { description: "`sealed_invalid`: a malformed entry, or a key for a device not on the list." }
        "403": { description: Not a member of a named workspace. }
        "409": { description: "`sealed_version_conflict`: the list changed first." }
  /api/sealed/workspaces/{id}/epochs:
    post:
      tags: [Encrypted records]
      summary: Start a workspace's encryption key, or replace it
      description: |
        Experimental. Only someone holding the current key may replace it, and
        all of their live devices must receive the new one. Optional `grants`
        hand it to other members' devices in the same request, checked as in
        `POST /api/sealed/workspaces/{id}/grants`.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Saved. }
        "400": { description: "`sealed_invalid`." }
        "403": { description: "`sealed_key_missing`: the caller does not hold the current key." }
        "404": { description: Not a member of this workspace. }
        "409": { description: "`sealed_version_conflict`: the epoch is not the next one." }
  /api/sealed/workspaces/{id}/grants:
    post:
      tags: [Encrypted records]
      summary: Hand the workspace key to other members' devices
      description: |
        Experimental. Body: `epoch` (the current one) and `grants`, each with
        `user`, `deviceSeq`, `wrap`, `signerSeq`, `chainSeq` (how far the
        caller's list had got), `recipientChainSeq` (how far the recipient's
        had) and `signature`, made by the caller's live device over
        `revoked-grant-signature-v1 ‖ workspace ‖ epoch ‖ recipient user ‖
        recipient HPKE key ‖ wrap ‖ granter user ‖ chainSeq ‖
        recipientChainSeq`. The caller must hold the current key and be able
        to invite members; each recipient must be able to read the vault and
        the device must be live on their list. Copies are never replaced. Each
        recipient is notified (`sealing_access_granted`).
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "Saved; `granted` lists the recipients." }
        "400": { description: "`sealed_invalid`: a bad signature, or a device not on the recipient's list." }
        "403": { description: "`sealed_key_missing`, `missing_permission` or `not_workspace_member`." }
        "404": { description: Not a member of this workspace. }
        "409": { description: "`sealed_epoch_stale` (not the current key, or a new one is due), `sealed_identity_keys_pending` (an identity key in the workspace is still under its key), or `sealed_version_conflict` (that device already holds it)." }
  /api/sealed/workspaces/{id}/members:
    get:
      tags: [Encrypted records]
      summary: Read every member's device list
      description: |
        Experimental. Each member's `user`, `email`, `isSelf`, `canRead` (the
        server's word on whether they may read the vault), `canGrant`,
        `holdsKey` (whether any of their devices holds the current key) and
        `devices`, in the same form as in `/api/sealed/state`; `epoch` is the
        current one. Public keys only: no wrapped keys
        and no values. A client checks each list itself and remembers where it
        starts; the start is what a member's fingerprint is made from.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Every member's device list. }
        "401": { description: Not signed in. }
        "403": { description: An API key cannot hold encryption keys. }
        "404": { description: Not a member of this workspace. }
  /api/sealed/account/epochs:
    post:
      tags: [Encrypted records]
      summary: Start your account key, or replace it
      description: |
        Experimental. The account key is wrapped only to the caller's own
        devices and holds their identities' private keys, so a workspace key
        shared with other members never opens them. Wraps and their signatures
        use the workspace key formats with `account:<user id>` in place of the
        workspace id. Only a holder of the current key may replace it, the new
        key must carry the old one in `priorWrap`, and every live device must
        receive it. Removing a device that held it makes a new one due.
      security:
        - Session: []
      responses:
        "200": { description: Saved. }
        "400": { description: "`sealed_invalid`." }
        "403": { description: "`sealed_key_missing`: the caller does not hold the current key." }
        "409": { description: "`sealed_version_conflict`: the epoch is not the next one." }
  /api/sealed/records:
    post:
      tags: [Encrypted records]
      summary: Create an end-to-end encrypted entry
      description: |
        Experimental. The client chooses the id, because the ciphertext is bound
        to it. The entry's `value` stays empty. A link serves it as ciphertext,
        and only once it holds a seal for it (`PUT /api/sealed/links/{id}`); it
        does not appear in short links, sign-in grants or request answers.
      security:
        - Session: []
      responses:
        "200": { description: The saved entry. }
        "400": { description: "`sealed_invalid` or `sealed_record_unsupported`." }
        "403": { description: "`sealed_key_missing`, or no access to the workspace." }
        "409": { description: "`sealed_epoch_stale`: reload the keys and encrypt again." }
  /api/sealed/records/{id}:
    put:
      tags: [Encrypted records]
      summary: Encrypt an entry, or replace an encrypted entry's value
      description: |
        Experimental. `expectedVersion` is compared atomically: 0 encrypts a
        plain entry, and a higher number replaces that version.

        `carryLinks: true` preserves existing live links during encryption.
        For each link whose key the device can open, `linkSeals` supplies
        `link`, `viewerWrap`, `writerWrap`, `expectedKeyWraps` (the complete
        previous scope map, or `{}`) and, for a first key, `keyWraps`.
        A section's entry is added explicitly to the carried link. The seals,
        keys and entry commit together. Aliases and server-created grants
        cannot be carried. Remaining links require `dropLinks: true`; without
        confirmation the response is `sealed_links_affected` with a count,
        and nothing changes. Their owners receive an in-app notification.
        Without `carryLinks`, the previous explicit-drop behavior remains.

        Replacing the value of an entry that live links carry takes
        `linkSeals`: for each link listed by
        `GET /api/sealed/records/{id}/links`, an object with `link`,
        `viewerWrap` and `writerWrap`, made for the version this write
        produces, plus `expectedWriterWrap` copied from the read. This
        comparison prevents a concurrent key replacement being undone by a
        stale record writer. Entry and seals are saved together. A write that leaves one
        of those links out is refused with `sealed_link_seals_missing` and the
        ids of the links it missed in `links`, and changes nothing.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: The saved entry. }
        "400": { description: "`sealed_invalid` or `sealed_record_unsupported`." }
        "403": { description: "`sealed_key_missing`." }
        "404": { description: No such entry, or not one the caller may change. }
        "409": { description: "`sealed_version_conflict`, `sealed_epoch_stale`, `sealed_links_affected` or `sealed_link_seals_missing`." }
  /api/sealed/records/{id}/links:
    get:
      tags: [Encrypted records]
      summary: List the links a write to an encrypted entry has to renew
      description: |
        Experimental. Answers with the entry's `version` and, in `links`, one
        object per link that carries the entry, can still be opened and holds
        a seal of that version: its `link` id and the `writerWrap`, which the
        entry's current value key opens. Paused links are included; revoked
        and expired ones are not.

        For encrypted entries the caller learns that those links exist,
        including other members' private ones, and nothing else about them.
        For plain entries this instead returns only visible live links that
        can carry the entry during encryption: `id`, `user`, `workspace`,
        `audienceKind` and `sealedKeyWraps`. Private links of other members
        are never disclosed. Aliases and server-created grants are omitted.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "`record`, `version` and `links`." }
        "404": { description: No such entry, or not one the caller may change. }
  /api/sealed/links/{id}:
    get:
      tags: [Encrypted records]
      summary: Read what a link holds for encrypted entries
      description: |
        Experimental. For a member who sees the link: `keyWraps`, the link's
        key per scope (the owner's account scope, and the workspace's id while
        the link is seen by more than its owner), each with `epoch` and
        `wrap`; and `seals`, one per encrypted entry with `record`, `version`
        and `current`. A seal that is not `current` was made for an older
        version of the entry and is not served to viewers.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "`link`, `keyWraps` and `seals`." }
        "404": { description: No such link, or not one the caller sees. }
    put:
      tags: [Encrypted records]
      summary: Put encrypted entries on a link
      description: |
        Experimental. `seals` holds one object per entry: `record`, the
        entry's current `version`, `viewerWrap` (the entry's value key for the
        link's viewers) and `writerWrap` (the key to that wrap, for whoever
        writes the entry next). Each entry joins the link's records in the
        same transaction. The collection API keeps refusing an encrypted
        entry on a link; taking one off a link stays with it, and removes the
        seal.

        `keyWraps` stores the link's key, which otherwise exists only in the
        link's address after `#`, per scope as `{epoch, wrap}`. The owner's
        account scope (`account:<user id>`) is written by the owner and is
        required as soon as the link holds a seal. The workspace's id is
        accepted while the link is seen by more than its owner, and is
        removed by the server when the link becomes private again.

        `replaceKey: true` replaces all scope wraps and encrypted-entry seals
        atomically, for the owner only. `expectedKeyWraps` must match the
        complete previous scope map, every encrypted entry must be covered
        at its current version, and no new entry may be added. The owner's
        wrap, and the workspace wrap for a wider audience, are required.
        A stale state or partial replacement changes nothing. The slug and
        plaintext entries stay as they were; old fragment keys no longer open
        encrypted entries.

        The server opens none of these. It checks that each one has the
        length its content gives it, that the caller holds the workspace's
        key and sees every entry, and that the link's owner sees them too.
        Links made by the server (request answers, sign-in shares) are
        refused.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "`link`, its `records`, and the `seals` written." }
        "400": { description: "`sealed_invalid` (a malformed wrap, or a scope the link does not allow), `sealed_link_content` (not an encrypted entry the caller sees, or no owner's copy of the key) or `sealed_record_unsupported`." }
        "403": { description: "`sealed_key_missing`, or an owner's key wrap sent by someone else." }
        "404": { description: No such link, or not one the caller may change. }
        "409": { description: "`sealed_version_conflict` (the entry changed first), `sealed_epoch_stale`, or `sealed_link_content` when the entry is on too many links." }
        "410": { description: The link is revoked or expired. }
  /api/sealed/records/{id}/unseal:
    post:
      tags: [Encrypted records]
      summary: Store an encrypted entry in plain text again
      description: |
        Experimental. The client decrypts the value and sends it back, signed by
        `deviceSeq`, a device on the caller's list.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: The saved entry. }
        "400": { description: "`sealed_invalid`." }
        "403": { description: "`sealed_key_missing`: no valid signature from a device on the list." }
        "404": { description: No such entry, or not one the caller may change. }
        "409": { description: "`sealed_version_conflict`." }
  /api/sealed/sessions/revoke:
    post:
      tags: [Encrypted records]
      summary: End every other session on this account
      description: |
        Experimental. Rotates the account's token key and answers with a new
        `token` for the caller. Every other session has to sign in again.
      security:
        - Session: []
      responses:
        "200": { description: "`token` replaces the caller's session." }
        "401": { description: Not signed in. }
        "403": { description: An API key cannot do this. }
  /api/sealed/reset:
    post:
      tags: [Encrypted records]
      summary: Start over after losing every device and the recovery key
      description: |
        Experimental. Clears the caller's device list and wrapped keys, and
        deletes encrypted entries in workspaces where nobody else holds the key.
        This cannot be undone. `confirm` must be `delete my encrypted records`.
      security:
        - Session: []
      responses:
        "200": { description: "`deleted` counts the entries removed." }
        "400": { description: "`sealed_invalid`: the confirmation is missing or wrong." }
  /api/contacts/{id}/send:
    post:
      tags: [Contacts]
      summary: Share vault entries with a contact
      description: |
        Mints a share of the named entries in the contact's workspace, owned by
        the caller, and answers with its `slug`.

        Every entry and section must be one the caller may read in that
        workspace; an id alone is not permission, so one from anywhere else is
        reported as not found. Where the contact's address belongs to an
        account here the share is put in their tray — a bookmark they can
        remove, resolved through the same public view as the slug itself, with
        every gate and view cap still applying.

        `channel` says how much of that the caller is told. It is
        `handed_over`, with `delivered` and `emailed` both false, unless
        something already connects the two: the contact was proven by the peer
        check, they share a workspace, or a grant has come the other way.
        Otherwise a precise answer would resolve any address that was typed
        in — `delivered` means it has an account here, and `emailed`, only ever
        attempted where it has none, means it does not. The `slug` is in every
        answer, so the grant can always be passed on by hand.

        Deliveries into a tray are bounded per pair of accounts per day while
        nothing connects them (`RATELIMIT_CONTACT_PAIR`, 3), and a recipient
        may refuse a sender outright through `contactBlocks`. Neither refusal
        is reported: "you have had your three" and "you are blocked" are both
        answers about the address, and a sender who learns of a block opens
        another account. The delivered bookmark carries `sender`, which is what
        a block is aimed at.

        A session is required: an API key authenticates as a program, and this
        is the one endpoint that writes into somebody else's account.

        Two audit rows are written: the share's own creation, and the handover
        naming the contact, whether it arrived, and why it did not.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                records:
                  type: array
                  items: { type: string }
                  description: Vault entry ids to share.
                sections:
                  type: array
                  items: { type: string }
                  description: >-
                    Vault section ids to share as units — entries added to one
                    later are shared too. At least one record or section is
                    required.
                label:
                  type: string
                  description: What the recipient sees this share called.
                expiresAt:
                  type: string
                  format: date-time
                maxViews:
                  type: integer
                  description: Views allowed before the share revokes itself.
      responses:
        "200":
          description: The share, and whether it reached an account here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  slug: { type: string }
                  kind: { type: string, enum: [share] }
                  channel:
                    type: string
                    enum: [account, email, manual, handed_over]
                    description: >-
                      Where it went, as far as the caller is told.
                      `handed_over` is the answer for a contact nothing
                      connects them to, and for a refused delivery: the grant
                      exists, the slug is here, and nothing is said about the
                      address. `delivered` and `emailed` are then both false,
                      which does not mean nothing arrived.
                  delivered:
                    type: boolean
                    description: >-
                      It is in the recipient's tray on this server. Only ever
                      true alongside `channel: account`.
                  emailed:
                    type: boolean
                    description: >-
                      The link was queued to be emailed to the contact's
                      address — queued, not accepted by a mail server. Only
                      ever true when `delivered` is false, where the address
                      has no account here, and where the operator's
                      `mail.recipients` policy admits it. The email carries
                      what the grant is called and a link, never what was
                      shared.
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/AppError" }

  /api/contacts/{id}/deliver:
    post:
      tags: [Contacts]
      summary: Deliver an existing share or request to a contact
      description: |
        Hands an existing grant to a contact without creating a new share or
        request. Its id, slug, protections and response inbox are preserved.

        A user session is required; API keys are refused. The contact must be
        visible to the caller, and the grant must be owned by the caller in
        the contact's workspace. The caller must also have permission to
        create the corresponding kind of grant in that workspace. Missing,
        inaccessible, other-owner and other-workspace grants return 404.
        Paused, revoked, expired or completed grants, and grants whose view or
        response cap has been reached, return 400.

        Delivery uses the same tray, email, blocking, per-pair limits and
        privacy-preserving response rules as `/api/contacts/{id}/send` and
        `/api/contacts/{id}/ask`. `handed_over` does not confirm whether the
        address has an account or whether delivery was refused. A repeated
        delivery does not queue a second successful email invitation for the
        same grant and recipient address.

        Shares with encrypted link-key wraps always return `channel: manual`,
        with `delivered` and `emailed` false. Their fragment keys stay on the
        caller's devices; the caller must share the complete address manually.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contact receiving the existing grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind:
                  type: string
                  enum: [share, request]
                id:
                  type: string
                  description: Existing link or request id, owned by the caller.
                locale:
                  type: string
                  description: Optional language hint for the email invitation.
      responses:
        "200":
          description: The original grant and the permitted delivery outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, slug, kind, channel, delivered, emailed]
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  slug: { type: string }
                  kind: { type: string, enum: [share, request] }
                  channel:
                    type: string
                    enum: [account, email, manual, handed_over]
                  delivered:
                    type: boolean
                    description: >-
                      In the recipient's tray; only true with `channel: account`.
                  emailed:
                    type: boolean
                    description: >-
                      Queued for email; only true with `channel: email`.
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/AppError" }

  /api/contacts/{id}/ask:
    post:
      tags: [Contacts]
      summary: Ask a contact for data
      description: |
        Mints a request in the contact's workspace, owned by the caller, and
        answers with its `slug`.

        `identity` is required and must be one the workspace holds: the name on
        an ask is what the responder is asked to trust. Without a `template`
        the responder may send whatever they choose. `maxResponses` defaults to
        1, because an ask is addressed to one person — left uncapped it is a
        form anyone holding the slug can keep filling in.

        Where the contact's address belongs to an account here the ask is put
        in their tray, as something to answer rather than something to read.
        `channel` says how much of that the caller is told, with the same
        reserve as `/api/contacts/{id}/send`: `handed_over` unless something
        already connects the two, and the same per-pair cap and blocks behind
        it.

        Two audit rows are written: the request's own creation, and the
        handover naming the contact, whether it arrived, and why it did not.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, identity]
              properties:
                label:
                  type: string
                  description: What the recipient sees they are being asked for.
                identity:
                  type: string
                  description: Identity signing the ask; must belong to the workspace.
                template:
                  type: string
                  description: Form the answer must match; omit to accept anything.
                expiresAt:
                  type: string
                  format: date-time
                maxResponses:
                  type: integer
      responses:
        "200":
          description: The request, and whether it reached an account here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  slug: { type: string }
                  kind: { type: string, enum: [request] }
                  channel:
                    type: string
                    enum: [account, email, manual, handed_over]
                    description: >-
                      As for a share: `handed_over` where the caller is told
                      nothing about the address, which is every contact
                      nothing connects them to.
                  delivered:
                    type: boolean
                    description: >-
                      It is in the recipient's tray. Only ever true alongside
                      `channel: account`.
                  emailed:
                    type: boolean
                    description: >-
                      The request was queued to be emailed. As for a share,
                      plus one condition: answering needs an account, so an
                      ask is only emailed while signups are open. The link
                      goes to the sign-up page, which opens the request in the
                      app afterwards.
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/AppError" }

  /api/links/{id}/archive:
    get:
      tags: [Grants]
      summary: Download a share's files as its recipient gets them
      description: |
        The owner's copy of the share's archive: the same zip the public
        archive serves, stamped when the share is watermarked. It claims no
        view. Only files the caller may read go in.
      security:
        - Session: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The archive, as an attachment named after the share.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/AppError" }
        "404":
          description: "`link_not_found` when the caller cannot see the share; `archive_empty` when no file could go in."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/stamp-preview:
    post:
      tags: [Records]
      summary: Preview a file with a stamp on it
      description: |
        Returns a stamped copy of a file record the caller may read. Pass
        `text` to try a stamp before creating a share — the line ends in
        `#preview`, so the copy can never pass for one read through a real
        share. Or pass `link` to see exactly what that share hands out; the
        share must grant the record. When `link` is set, `text` is ignored.
      security:
        - Session: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                record: { type: string, description: The file record's id. }
                text: { type: string, description: "One line of 1 to 120 characters, trimmed." }
                link: { type: string, description: A share's id. }
      responses:
        "200":
          description: The stamped copy, as an attachment named `<name>-preview<ext>`.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          description: "`watermark_text_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "404":
          description: "`record_not_found` or `link_not_found`: missing, not visible to the caller, not a file, or not granted by the share."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "415":
          description: "`file_not_watermarkable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/connections/authorize:
    post:
      tags: [Connections]
      summary: Authorize a tool (from the app)
      description: |
        Called by the owner's app after they agreed to connect a tool. Finds or
        creates the connection for the tool's origin in the active workspace,
        renews it for 90 days (tokens of a connection that had lapsed are
        deleted, not revived), and returns a one-time code, valid for five minutes, bound to the tool's PKCE
        challenge and return address. The app then opens the return address with
        `code` and the tool's `state`.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, redirectUri, challenge]
              properties:
                clientId: { type: string, example: "https://mietunterlagen.revoked.link", description: "The tool's origin." }
                clientName: { type: string, maxLength: 40, description: "The name the tool gives itself; shown as a claim." }
                redirectUri: { type: string, description: "Where the code is delivered; must be on `clientId`'s origin." }
                allowRevoke:
                  type: boolean
                  description: |
                    Whether the tool may revoke the links its proposals became.
                    Left out, a connection keeps what it had; a new one starts
                    without it.
                allowHandOver:
                  type: boolean
                  description: |
                    Whether the tool may receive links the owner shares with
                    it. Left out, a connection keeps what it had; a new one
                    starts without it. A link can only be created with
                    `handedOver` while this is set
                    (`link_hand_over_not_allowed` otherwise), and the tool
                    stops seeing the URLs it was given when it is taken away.
                allowVaultRead:
                  type: boolean
                  description: |
                    Whether the tool may read the owner's whole vault through
                    `/api/vault`. Left out, a connection keeps what
                    it had; a new one starts without it. Refused together with
                    `poll` (`connection_vault_polled`), and a token collected by
                    polling never reads the vault.
                permissions:
                  type: array
                  items: { type: string }
                  description: |
                    Permission keys from the catalogue the tool may act on:
                    `shares:read`, `shares:manage`, `requests:manage`,
                    `attestations:issue`, `vault:read`, `vault:write`. Anything
                    else is refused with `connection_permission_invalid`, and
                    a key the owner does not hold with `permission_escalation`.
                    Replaces what the connection held, keeping the narrower
                    `allowRevoke` and `allowHandOver`. The vault keys reach only
                    the tool's sections, or the whole vault with
                    `allowVaultRead`.
                section:
                  type: boolean
                  description: |
                    Give the tool a section of its own, named after it, where
                    it may write records and files. Asking for it asks for
                    `vault:write` unless `permissions` says `vault:read`.
                    `false` takes the tool's vault access away and keeps the
                    section: giving it back brings the same one.
                sections:
                  type: array
                  items: { type: string }
                  description: |
                    The owner's own sections the tool may read and not change.
                    Refused with `vault_section_invalid` for any other.
                challenge: { type: string, description: "PKCE S256 challenge, base64url." }
                reuse:
                  type: boolean
                  description: |
                    Set when the owner was not asked again because the tool is
                    already connected and another of their browsers wants in.
                    Only issues a code: the connection keeps its name,
                    permissions and expiry (`allowRevoke` and `allowHandOver`
                    are ignored). Refused with `connection_not_connected` when
                    there is no live connection for the origin.
                poll:
                  type: boolean
                  description: |
                    Set when the page that asked collects the answer itself:
                    the tool named the owner's server in its link (`poll`), so
                    the app opens no return address and the page exchanges its
                    verifier alone at `/api/connect/token`. No return address
                    ties such an answer to one of the owner's own browsers, so
                    the app never sets it unasked, `reuse` included: the owner
                    compares a code both ends derive from the challenge (the
                    first three bytes of its SHA-256, as `83C-047`).
      responses:
        "200":
          description: The one-time code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  connectionId: { type: string }
        "400":
          description: "`connection_client_invalid`, `connection_redirect_invalid`, `connection_challenge_invalid`, `connection_vault_polled`, `connection_permission_invalid`, `permission_escalation` or `vault_section_invalid`."
        "409":
          description: "`connection_not_connected`: `reuse` was set, but the tool is not connected or its connection has lapsed. `connection_paused`: the owner paused the tool, and connecting again doesn't lift that."
  /api/connect/token:
    post:
      tags: [Connections]
      summary: Exchange a code for a connection token (the tool)
      description: |
        Spends the one-time code — right or wrong, a code works once — and, when
        the verifier matches its challenge and the return address matches,
        returns a token for this browser. Rate-limited per IP.

        Without `code`, the page asks for an answer the app left for it
        (`poll` on authorize): it is found by the verifier's challenge, and
        given only to a request whose `Origin` is the tool's own. Until the
        owner has answered there is nothing to find, and the reply is `202`;
        a tool asks again every few seconds, for as long as an answer is kept
        (five minutes). An answer issued as a code is never found this way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifier, redirectUri]
              properties:
                code: { type: string, description: "Left out by a page that collects its answer itself." }
                verifier: { type: string, description: "The PKCE verifier." }
                redirectUri: { type: string, description: "The same return address the code was issued for." }
      responses:
        "200":
          description: The token, shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  connection:
                    type: object
                    properties:
                      id: { type: string }
                      clientName: { type: string }
                      expiresAt: { type: string, description: "When the connection lapses." }
        "202":
          description: No code was sent, and the owner has not answered yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { type: boolean }
        "400":
          description: "`connection_grant_invalid`."
        "429":
          description: "`rate_limited`."
  /api/connection:
    get:
      tags: [Connections]
      summary: The status of what the tool proposed
      description: |
        The links, requests, attestations and attestation checks the tool's
        proposals became. `url` appears only on links the owner handed to the
        tool, and only while they can be opened. A request never carries its
        address or its answers, and an attestation never its claims or offer
        token. A check carries its verdict once answered, with the claims the
        other person chose to show. A tool stores nothing here: `ref` and
        `label` are what it set on the proposal.
      security:
        - Connection: []
      responses:
        "200":
          description: The connection as the tool may see it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  clientId: { type: string }
                  clientName: { type: string }
                  expiresAt:
                    type: string
                    description: |
                      When the connection lapses, 90 days after the owner last
                      connected the tool. Only connecting again from the app
                      renews it.
                  allowRevoke:
                    type: boolean
                    description: Whether the owner lets the tool end what it proposed or created.
                  allowHandOver:
                    type: boolean
                    description: Whether the owner lets the tool receive links.
                  permissions:
                    type: array
                    items: { type: string }
                    description: The catalogue keys the tool holds in full.
                  vaultAccess: { type: string, enum: ["", read, write] }
                  section: { type: string, description: "The tool's own section, if it has one." }
                  sections:
                    type: array
                    items: { type: string }
                    description: Sections the owner added, which the tool may read.
                  allowVaultRead: { type: boolean, description: "Whether the owner let the tool read the whole vault." }
                  vaultReadable: { type: boolean, description: "Whether this token reaches the whole vault: never one collected by polling." }
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ref: { type: string, description: "The tool's own reference from the proposal." }
                        label: { type: string }
                        status: { type: string, enum: [active, paused, revoked, expired] }
                        viewCount: { type: integer }
                        maxViews: { type: integer }
                        expiresAt: { type: string }
                        created: { type: string }
                        handedOver: { type: boolean }
                        url: { type: string, description: "Only when handed over and active." }
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ref: { type: string }
                        label: { type: string }
                        status: { type: string, enum: [active, paused, revoked, expired, completed] }
                        responseCount: { type: integer }
                        maxResponses: { type: integer }
                        expiresAt: { type: string }
                        created: { type: string }
                  attestations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ref: { type: string }
                        type: { type: string }
                        label: { type: string }
                        status: { type: string, enum: [offered, active, revoked] }
                        subjectName: { type: string }
                        subjectFingerprint: { type: string }
                        subjectDomain: { type: string }
                        expiresAt: { type: string }
                        issuedAt: { type: string }
                        created: { type: string }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ref: { type: string }
                        type: { type: string }
                        status: { type: string, enum: [open, answered, expired] }
                        expiresAt: { type: string }
                        answeredAt: { type: string }
                        created: { type: string }
                        verdict:
                          type: object
                          description: Once answered. The same verdict as `POST /api/attestations/verify`, without its reason.
                          properties:
                            state: { type: string }
                            issuer: { type: string }
                            type: { type: string }
                            claims: { type: object, additionalProperties: true }
                            withheld: { type: integer }
                            status: { type: string }
                            holder:
                              type: object
                              properties:
                                fingerprint: { type: string }
                                domain: { type: string }
                                state: { type: string }
                                status: { type: string }
        "401":
          description: "`connection_unauthorized`, or `connection_expired` once the connection has lapsed."
        "403":
          description: "`connection_paused`: the owner paused the tool. Keep the token."
    delete:
      tags: [Connections]
      summary: Disconnect (the tool)
      description: Deletes the connection. The owner's links stay; they no longer name the tool.
      security:
        - Connection: []
      responses:
        "204":
          description: Disconnected.
        "401":
          description: "`connection_unauthorized`, or `connection_expired` once the connection has lapsed."
        "403":
          description: "`connection_paused`: the owner paused the tool. Keep the token."
  /api/connection/links/{id}/revoke:
    post:
      tags: [Connections]
      summary: Revoke one of the tool's links (the tool)
      description: |
        Ends a link the tool's proposal became, or one it created. Only when
        the owner allowed it (`allowRevoke`, or `shares:manage`).
        The owner is notified as for any revocation. Revoking a link that is
        already revoked succeeds.
      security:
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The link as the tool may see it, now revoked.
        "401":
          description: "`connection_unauthorized` or `connection_expired`."
        "403":
          description: "`connection_revoke_not_allowed`, or `connection_paused` while the owner has the tool paused."
        "404":
          description: Not a link of this tool.
  /api/connection/drafts:
    post:
      tags: [Connections]
      summary: Suggest values for a proposal (the tool)
      description: |
        Holds text values the tool heard from the owner, so a share proposal
        can offer them prefilled. Returns a draft id for the proposal link
        (`draft=<id>`); the link never carries the values. Drafts are kept in
        the server's memory only, for one hour, and are gone on restart.
        Nothing is saved to the vault: the app offers a value only for a key
        the vault does not hold yet, and the owner saves it. The audit log
        (`tool_drafted_values`) names the keys, never the values. At most 20
        open drafts per connection.
      security:
        - Connection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  description: 1-50 keys (`[a-z0-9_-]{1,64}`), each non-empty text of at most 4000 characters without control characters other than line breaks and tabs.
                  additionalProperties: { type: string }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: 24 characters, a-z and 0-9. }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: The values are refused whole when any part is malformed.
        "401":
          description: "`connection_unauthorized` or `connection_expired`."
        "403":
          description: "`connection_paused` while the owner has the tool paused."
        "429":
          description: Too many open drafts for this connection.
  /api/connections/drafts/{id}:
    get:
      tags: [Connections]
      summary: Read a tool's suggested values (the owner)
      description: |
        The values a connected tool suggested, for the proposal screen. Only
        the owner of the tool's connection reads them, and not while the
        connection is paused or expired.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  connection: { type: string }
                  clientName: { type: string }
                  values:
                    type: object
                    additionalProperties: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401":
          description: Not signed in.
        "404":
          description: No such draft for this person, or it expired.
    delete:
      tags: [Connections]
      summary: Discard a tool's suggested values (the owner)
      description: Drops the draft once the proposal is created or declined. Succeeds when it is already gone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Discarded, or already gone.
        "401":
          description: Not signed in.
  /api/connection/vault:
    get:
      tags: [Connections]
      summary: List the vault (the tool, older path)
      description: The same as `GET /api/vault`, kept for tools written against it.
      security:
        - Connection: []
      responses:
        "200":
          description: As `GET /api/vault`.
        "403":
          description: As `GET /api/vault`.
  /api/connection/vault/{id}:
    get:
      tags: [Connections]
      summary: Read one record (the tool, older path)
      description: The same as `GET /api/vault/{id}`.
      security:
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: As `GET /api/vault/{id}`.
        "404":
          description: As `GET /api/vault/{id}`.
  /api/connection/links:
    post:
      tags: [Connections]
      summary: Create a share (the tool)
      description: |
        Shares records and sections within the tool's reach, at once. Needs
        `shares:manage`. The share is the owner's and joins the connection, as
        a proposal the owner saved does; the owner can pause, change or revoke
        it in the app. A record or section out of reach answers 404, like a
        missing one.
      security:
        - Connection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                records: { type: array, items: { type: string } }
                sections: { type: array, items: { type: string } }
                expiresAt: { type: string, description: "Left out, the share does not expire." }
                maxViews: { type: integer }
                ref: { type: string, description: "The tool's own reference, returned with the link's status." }
      responses:
        "201":
          description: The link as the tool sees it, with its `url`.
        "403":
          description: "`connection_not_permitted`, or `connection_paused`."
        "404":
          description: "`record_not_found`: a record or section out of reach."
  /api/connection/requests:
    post:
      tags: [Connections]
      summary: Create a request (the tool)
      description: |
        Asks for data in the owner's workspace, at once. Needs
        `requests:manage`. `identity` names the identity it asks as; left out,
        the workspace's primary one. `template` is a template id or name in the
        workspace. The answers land with the owner as for any request; the
        tool sees where the request stands, never the answers. `url` is the
        app link to pass to whoever should answer. Refused to a token
        collected by polling (`connection_polled`): whoever sent the owner a
        connect link can read them its check code, and a request asks
        strangers for data in the owner's name.
      security:
        - Connection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                template: { type: string }
                identity: { type: string }
                expiresAt: { type: string }
                maxResponses: { type: integer }
                ref: { type: string }
      responses:
        "201":
          description: The request as the tool sees it, with its `url`.
        "403":
          description: "`connection_not_permitted`, `connection_polled`, `template_not_owned`, `identity_required`, `identity_not_owned` or `identity_revoked`."
  /api/vault:
    get:
      tags: [Vault]
      summary: List the records within reach
      description: |
        The records a key or tool may read, without values: those in its
        sections, or for a whole-vault connection the owner's own records.
        Encrypted records, and answers others sent, are left out. `writable`
        says whether this key or tool wrote the record and may change it;
        `writtenByName` names whoever wrote one.
      security:
        - ApiKey: []
        - Connection: []
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        key: { type: string }
                        label: { type: string }
                        type: { type: string }
                        format: { type: string }
                        updated: { type: string }
                        sections: { type: array, items: { type: string } }
                        writable: { type: boolean }
                        writtenByName: { type: string }
        "401":
          description: "`not_authenticated`, `connection_unauthorized` or `connection_expired`."
        "403":
          description: "`vault_not_allowed` (a key without vault access), `connection_vault_not_allowed`, `connection_vault_polled`, or `connection_paused`."
        "429":
          description: "`rate_limited`: 120 reads a minute by default (`RATELIMIT_CONNECTION_VAULT_READS`)."
    post:
      tags: [Vault]
      summary: Write a record
      description: |
        Creates a record in a section the key or tool may write to: a tool's
        own section, or one of a key's sections (`section`, default the
        first). Needs `vault:write`. Send JSON, or `multipart/form-data` with
        the bytes in `file` for a file record. The record is the owner's and
        is marked as written by this key or tool. Its values and files count
        against `CONNECTION_STORAGE_MB` (default 100, 0 for no cap). Audited
        without the value.
      security:
        - ApiKey: []
        - Connection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                label: { type: string }
                type: { type: string, description: "Left out: `text`, or `file` with an upload." }
                format: { type: string, enum: [default, hidden] }
                value: { type: string }
                section: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                key: { type: string }
                label: { type: string }
                filename: { type: string }
                section: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: The record, without its value.
        "400":
          description: A field failed validation.
        "403":
          description: "`vault_section_not_writable`."
        "409":
          description: "`vault_key_taken`."
        "413":
          description: "`vault_storage_exceeded`."
  /api/vault/{id}:
    get:
      tags: [Vault]
      summary: Read one record
      description: |
        One record within reach with its current `value`; an alias reads
        through to its entry. A file record gives `filename`, `mime` and
        `size`; its bytes are at `/api/vault/{id}/file`. Each read is in the
        owner's audit log by key.
      security:
        - ApiKey: []
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The record and its value.
        "404":
          description: "`record_not_found`: out of reach, encrypted, or missing."
    patch:
      tags: [Vault]
      summary: Change a record it wrote
      description: |
        Changes `label`, `format`, `value`, `filename` or the uploaded `file`
        of a record this key or tool wrote. A record the owner put in its
        section is read-only to it.
      security:
        - ApiKey: []
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The record, without its value.
        "403":
          description: "`vault_read_only` or `vault_section_not_writable`."
        "404":
          description: "`record_not_found`."
    delete:
      tags: [Vault]
      summary: Delete a record it wrote
      security:
        - ApiKey: []
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted.
        "403":
          description: "`vault_read_only` or `vault_section_not_writable`."
        "404":
          description: "`record_not_found`."
  /api/vault/{id}/file:
    get:
      tags: [Vault]
      summary: Download a file record
      description: Always an attachment, never sniffed.
      security:
        - ApiKey: []
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file.
        "404":
          description: "`record_not_found`."
  /api/connection/requests/{id}/close:
    post:
      tags: [Connections]
      summary: Close one of the tool's requests (the tool)
      description: |
        Stops a request the tool's proposal became from taking new answers.
        The answers already given stay their responders' links. Only when the
        owner allowed it (`allowRevoke`, or `requests:manage`). Closing a
        closed request succeeds.
      security:
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The request as the tool may see it, now `revoked`.
        "401":
          description: "`connection_unauthorized` or `connection_expired`."
        "403":
          description: "`connection_revoke_not_allowed`, or `connection_paused` while the owner has the tool paused."
        "404":
          description: Not a request of this tool.
  /api/connection/attestations/{id}/revoke:
    post:
      tags: [Connections]
      summary: Revoke one of the tool's attestations (the tool)
      description: |
        Revokes an attestation the tool proposed and the owner issued, or
        withdraws its offer. Final: it reaches verifiers through the status
        list, as when the owner revokes it. Only when the owner allowed it
        (`allowRevoke`, or `attestations:issue`).
      security:
        - Connection: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The attestation as the tool may see it, now `revoked`.
        "401":
          description: "`connection_unauthorized` or `connection_expired`."
        "403":
          description: "`connection_revoke_not_allowed`, or `connection_paused` while the owner has the tool paused."
        "404":
          description: Not an attestation of this tool.
  /api/connections/{id}/permissions:
    post:
      tags: [Connections]
      summary: Change what a tool is allowed (the owner)
      description: |
        What the owner decides per connection, with the same fields as
        authorizing it. A field left out stays as it is. `allowVaultRead` can
        only be withdrawn here; `true` is refused with
        `connection_vault_reconnect`, because granting it takes a connect the
        tool asks for.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions: { type: array, items: { type: string }, description: "As on authorize." }
                section: { type: boolean, description: "As on authorize." }
                sections: { type: array, items: { type: string }, description: "As on authorize." }
                allowRevoke: { type: boolean, description: "The tool may end what it proposed." }
                allowHandOver: { type: boolean, description: "The tool may receive the links its proposals became." }
                allowVaultRead: { type: boolean, description: "Only `false`: the tool stops reading the whole vault at once." }
      responses:
        "200":
          description: The permissions as they now stand.
        "400":
          description: "`connection_vault_reconnect`, `connection_permission_invalid`, `permission_escalation` or `vault_section_invalid`." 
        "404":
          description: Not one of your connections.
  /api/connections/{id}/pause:
    post:
      tags: [Connections]
      summary: Pause a tool (the owner)
      description: |
        Refuses the tool's tokens with `connection_paused`, stops it connecting
        another browser or adding links, and pauses its active links. Nothing
        else changes, and its expiry keeps running.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`{ \"paused\": true }`."
        "404":
          description: Not one of your connections.
  /api/connections/{id}/resume:
    post:
      tags: [Connections]
      summary: Activate a paused tool (the owner)
      description: |
        Lets the tool's tokens work again and restores the links the pause
        paused. A link the owner paused or changed themselves is left as it is.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`{ \"paused\": false }`."
        "404":
          description: Not one of your connections.
  /api/connections/{id}/disconnect:
    post:
      tags: [Connections]
      summary: Disconnect a tool (the owner)
      description: |
        Deletes the connection and its tokens. With `revokeLinks` its links are
        revoked. Otherwise they stay the owner's, and one paused by pausing the
        tool stays paused.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revokeLinks: { type: boolean, description: "Also revoke every link the tool proposed." }
      responses:
        "204":
          description: Disconnected.
        "404":
          description: Not one of your connections.
  /api/sign-ins/{id}/pause:
    post:
      tags: [OpenID Connect]
      summary: Pause a service you signed in to
      description: |
        Refuses new sign-ins at the service, its access tokens and its unredeemed
        codes, and pauses its grant. An authorization request is answered
        `access_denied`, the same as a decline. Does nothing to a disconnected
        service.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`status` and `newIdOnReturn` as they now stand."
        "404":
          description: Not one of your sign-ins.
  /api/sign-ins/{id}/resume:
    post:
      tags: [OpenID Connect]
      summary: Activate a paused service
      description: |
        Undoes a pause. A grant the owner paused or changed themselves is left as
        it is. Does nothing to a service that isn't paused.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`status` and `newIdOnReturn` as they now stand."
        "404":
          description: Not one of your sign-ins.
  /api/sign-ins/{id}/disconnect:
    post:
      tags: [OpenID Connect]
      summary: Disconnect a service you signed in to
      description: |
        Revokes its grant in whichever workspace it lives, and refuses for good
        every access token and code issued so far. The row stays, marked
        `disconnected`. A later sign-in needs a new approval in the app.

        With `newId` the next sign-in gets a new `sub`, unrelated to the old one,
        and a new grant id, and the remembered name is forgotten. It can't be
        undone: calling this again can add a new ID, never take one back. None
        of this reaches the session the service keeps for itself.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newId: { type: boolean, description: "Give the service a new `sub` at the next sign-in." }
      responses:
        "200":
          description: "`status` and `newIdOnReturn` as they now stand."
        "404":
          description: Not one of your sign-ins.
  /api/webhooks/event-types:
    get:
      tags: [Webhooks]
      summary: List the event types
      description: |
        The catalogue an endpoint subscribes from. `noisy` types are left out of `"*"`.
        `privateCallbacks` says whether this server delivers to loopback and
        private addresses (`ALLOW_PRIVATE_CALLBACKS`); when it is `false`, an
        endpoint at such an address is refused.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  privateCallbacks: { type: boolean }
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/endpoints:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      description: |
        Every endpoint in the active workspace, with the last day's `stats`. Never includes the secret.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: |
        `events` defaults to `["*"]`. The answer carries the signing `secret`.
      security:
        - Session: []
        - ApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, example: "https://example.com/hooks/revoked" }
                description: { type: string }
                events: { type: array, items: { type: string }, example: ["*"] }
                enabled: { type: boolean }
      responses:
        "201":
          description: The endpoint, with `secret`.
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/endpoints/{id}/metrics:
    get:
      tags: [Webhooks]
      summary: How an endpoint has done
      description: |
        Its attempts over `range` (`1h` in 5-minute buckets, `24h` hourly,
        the default, or `7d` in 6-hour buckets), oldest first: how many were
        answered with a 2xx and how many weren't, with the median and p95
        response time. Also the range's answers by kind (`2xx`, `4xx`, `5xx`,
        `none` for no answer), the deliveries made and how many got through on
        the first try, how many wait to be tried again right now, and the
        event types sent most. The endpoint list carries the last day as
        `series`.
      security:
        - Session: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, enum: [1h, 24h, 7d], default: 24h }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  range: { type: string }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string }
                        delivered: { type: integer }
                        failed: { type: integer }
                        p50Ms: { type: integer }
                        p95Ms: { type: integer }
                  deliveries: { type: integer }
                  firstTry: { type: integer }
                  retrying: { type: integer }
                  p95Ms: { type: integer }
                  codes:
                    type: object
                    properties:
                      2xx: { type: integer }
                      4xx: { type: integer }
                      5xx: { type: integer }
                      none: { type: integer }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        count: { type: integer }
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
        "404":
          description: Not an endpoint of this workspace.
  /api/webhooks/endpoints/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Webhooks]
      summary: Get a webhook endpoint
      description: |
        One endpoint, with the last day's `stats`.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
    patch:
      tags: [Webhooks]
      summary: Change a webhook endpoint
      description: |
        Any of `url`, `description`, `events`, `enabled`. Turning it on clears the failing clock.
      security:
        - Session: []
        - ApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, example: "https://example.com/hooks/revoked" }
                description: { type: string }
                events: { type: array, items: { type: string }, example: ["*"] }
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: |
        Deletes the endpoint and its delivery log.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "204":
          description: Deleted.
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/endpoints/{id}/secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Webhooks]
      summary: Show the signing secret
      description: |
        The current secret, for setting up the receiving side.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/endpoints/{id}/rotate-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: |
        A new secret. The previous one keeps signing alongside it for 24 hours.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/endpoints/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Webhooks]
      summary: Send a test event
      description: |
        Sends one sample of `type` now, once, marked `test: true`, and answers with the delivery.
      security:
        - Session: []
        - ApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, example: link.revoked }
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/endpoints/{id}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Webhooks]
      summary: Resend failed deliveries
      description: |
        Queues every failed delivery since `since` (RFC 3339, default 24 hours ago) again. Answers `{ queued }`.
      security:
        - Session: []
        - ApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                since: { type: string, format: date-time }
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/events:
    get:
      tags: [Webhooks]
      summary: List events
      description: |
        The workspace's events, newest first. Filter with `type`; page with `page` and `perPage`.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: List deliveries
      description: |
        Newest first. Filter with `endpoint`, `status` (`pending`, `succeeded`, `failed`), `type` or `event`.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/deliveries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Webhooks]
      summary: Get a delivery
      description: |
        The delivery with its `payload` and `attemptLog`: each attempt's status, response body (first 2 KB), error and duration.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/webhooks/deliveries/{id}/resend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Webhooks]
      summary: Resend a delivery
      description: |
        Tries it once more now. Success marks it delivered; failure leaves the automatic retries unchanged.
      security:
        - Session: []
        - ApiKey: []
      responses:
        "200":
          description: OK
        "403":
          description: The caller lacks Manage webhooks (`webhook:manage`).
  /api/requests/callback-test:
    post:
      tags: [Grants]
      summary: Send a sample delivery to a callback URL
      description: |
        POSTs one example payload to `url` from this server, through the same
        client a real delivery uses — so the result reflects what the server can
        actually reach, and the SSRF policy applies exactly as it does at save
        time.

        The sample carries `test: true` on top of the usual fields, so a
        receiving workflow can branch on it. Pass `requestId` to send the real
        request's id and slug (and its id in `X-Revoked-Request`); omit it to
        test a URL before the request is saved.

        A target that is refused, unreachable, or answers an error is reported
        in the body with `ok: false` — the call itself still returns 200.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "https://example.com/hook" }
                requestId: { type: string }
      responses:
        "200":
          description: What the target answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: integer, description: "0 when nothing was reached." }
                  code:
                    type: string
                    enum: [ok, blocked, unreachable, status]
                    description: |
                      `blocked` — refused by the callback policy (loopback,
                      private range, bad scheme). `unreachable` — no connection,
                      DNS failure or timeout. `status` — the hook answered 4xx/5xx.
                  detail: { type: string }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/AppError" }

  /api/account:
    delete:
      tags: [Workspaces]
      summary: Delete the authenticated account
      description: |
        Removes the account and everything reachable through it. Workspaces the
        account is alone in are torn down entirely; in shared workspaces its
        content is handed to a remaining member rather than orphaned.

        Refused while the account is the last member able to administer a
        shared workspace, since that would leave the workspace unadministrable.

        Users only — an API key must not be able to delete the person behind it.
      security:
        - Session: []
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/AppError" }
        "409":
          description: The account is the last administrator of a shared workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /api/account/features:
    put:
      tags: [Workspaces]
      summary: Choose which parts of the app the account sees
      description: |
        Replaces the account's feature set with the keys given. Every key must
        be in the catalogue at `GET /api/features`, or nothing is stored and
        the answer is `unknown_feature`. An empty list means the vault alone.

        This is the only way the field is written: a `PATCH` on the users
        record refuses it. The stored set is readable on the account's own
        record as `features`, and is `null` while the account has never
        chosen — then the catalogue's defaults apply, and an accepted invite
        that carries a starting set fills it in.

        Users only. A feature set is a person's view of the app, which an API
        key has none of.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [features]
              properties:
                features:
                  type: array
                  items: { type: string, examples: ["sharing"] }
      responses:
        "200":
          description: The stored set, in catalogue order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items: { type: string }
        "400":
          description: "`unknown_feature`: a key is not in the catalogue."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401": { $ref: "#/components/responses/AppError" }

  /passkey:
    get:
      tags: [Sign-in]
      summary: The sign-in page
      description: |
        The page every passkey ceremony runs on, opened in the system browser.
        What it does is read from its address: `mode=signin` (the default) or
        `mode=signup`, or a `ticket` to add a passkey to the account the
        ticket names. An app passes its PKCE `challenge` and a `state`; when
        the ceremony succeeds the page opens
        `revoked://auth?code=…&state=…`, and the app redeems the code at
        `/api/passkeys/token`.
      security: []
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [signin, signup, enroll] } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: challenge, in: query, schema: { type: string }, description: "PKCE S256 challenge, base64url." }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: The page.
          content:
            text/html: {}

  /app:
    get:
      tags: [Sign-in]
      summary: Continue on the phone
      description: |
        Where the QR code the app shows on a computer leads. It opens the app
        (`revoked://open`) and, when the operator set `APP_STORE_URL` or
        `PLAY_STORE_URL`, a download link for the phone it is opened on.
        It names the server, so the app on the phone can be pointed at it.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}

  /api/passkeys/login/begin:
    post:
      tags: [Sign-in]
      summary: Start a passkey sign-in
      description: |
        Returns WebAuthn request options for a discoverable credential — no
        account is named; the authenticator's answer says whose passkey it is.
        Must be called at the server's own address (`localhost` on a
        development machine, never a loopback IP). Rate-limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string, description: "The app's PKCE S256 challenge; the code issued at the end is bound to it." }
      responses:
        "200":
          description: The ceremony, good for five minutes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string }
                  options: { type: object, description: "`{publicKey: PublicKeyCredentialRequestOptions}`, binary members base64url." }
        "400":
          description: "`passkey_request_invalid` or `passkey_origin_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/login/finish:
    post:
      tags: [Sign-in]
      summary: Finish a passkey sign-in
      description: |
        Verifies the authenticator's assertion and returns a one-time code,
        good for two minutes, that only the holder of the PKCE verifier can
        redeem. A ceremony is answered once, right or wrong.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, credential]
              properties:
                session: { type: string }
                credential: { type: object, description: "The `PublicKeyCredential`, binary members base64url." }
      responses:
        "200":
          description: The one-time code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  accepted:
                    type: object
                    description: "What the account holds now, for the WebAuthn Signal API: a passkey removed from the account, or a changed address, then also leaves or changes in the password manager."
                    properties:
                      userId: { type: string, description: "The user handle, base64url." }
                      credentials: { type: array, items: { type: string }, description: "Every credential id the account still accepts, base64url." }
                      name: { type: string, description: "The account's email address." }
        "400":
          description: "`passkey_ceremony_invalid`, `passkey_request_invalid` or `passkey_origin_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: "`passkey_verification_failed`, or `passkey_unknown`: no account on this server holds this passkey any longer (its account was deleted or the key removed), so a client can ask the password manager to drop it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/register/begin:
    post:
      tags: [Sign-in]
      summary: Start registering a passkey
      description: |
        Either a new account — `email`, where the operator allows signups — or
        a `ticket`, which adds a passkey to the account it names. Returns
        WebAuthn creation options that require a discoverable credential and
        user verification. Nothing is written until the ceremony finishes.

        Where the operator asks new accounts to confirm their address
        (`SIGNUP_VERIFY_EMAIL`), a new account also needs the `proof` from
        `/api/passkeys/register/verify`. It is checked here and spent when the
        ceremony finishes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, description: "The new account's address. Ignored with a ticket." }
                ticket: { type: string, description: "A one-time ticket from `/api/passkeys/tickets` or the operator." }
                name: { type: string, maxLength: 60, description: "What the passkey is called in the owner's list." }
                challenge: { type: string, description: "The app's PKCE S256 challenge, when the result should sign an app in." }
                proof: { type: string, description: "The confirmed address, from `/api/passkeys/register/verify`. Required for a new account where the operator asks for confirmation." }
      responses:
        "200":
          description: The ceremony, good for five minutes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string }
                  options: { type: object, description: "`{publicKey: PublicKeyCredentialCreationOptions}`, binary members base64url." }
        "400":
          description: "`passkey_email_invalid`, `passkey_ticket_invalid`, `passkey_request_invalid` or `passkey_origin_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: "`signups_disabled`: no ticket, and this server does not accept registrations. `email_verification_required`: the address was not confirmed, or the proof is for another one."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "409":
          description: "`passkey_email_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/register/email:
    post:
      tags: [Sign-in]
      summary: Send a code that confirms a new account's address
      description: |
        Only where the operator asks new accounts to confirm their address
        (`SIGNUP_VERIFY_EMAIL`). Mails a 6-digit code, good for ten minutes
        and five guesses, replacing any earlier one. An address is sent at most
        one code a minute and five an hour; each client is limited separately
        (`RATELIMIT_SIGNUP_EMAILS` per hour).

        An address that already has an account gets the same answer and the
        same limits, but its mail says that an account exists and carries no
        code. The endpoint does not tell anyone whether an address is
        registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                locale: { type: string, enum: [en, de], description: "Language of the mail; anything else sends English." }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt: { type: string, format: date-time }
                  resendAfter: { type: integer, description: "Seconds until another code may be asked for." }
        "400":
          description: "`passkey_email_invalid`, `passkey_request_invalid`, or `email_verification_off`: this server does not confirm addresses."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: "`signups_disabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429":
          description: "`email_code_too_soon`, or `rate_limited`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "502":
          description: "`email_send_failed`: the mail server refused or could not be reached."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /api/passkeys/register/verify:
    post:
      tags: [Sign-in]
      summary: Trade the mailed code for a proof
      description: |
        The right code is spent and returns a proof of the address, good for
        fifteen minutes, that `/api/passkeys/register/begin` then carries. A
        wrong code costs one of its five attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof: { type: string }
        "400":
          description: "`email_code_invalid`: wrong, expired, spent, or guessed too often."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/register/finish:
    post:
      tags: [Sign-in]
      summary: Finish registering a passkey
      description: |
        Verifies the attestation, then writes the passkey — and, for a signup,
        the account — and spends the ticket. Returns a one-time code when the
        ceremony was started with a PKCE challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, credential]
              properties:
                session: { type: string }
                credential: { type: object, description: "The `PublicKeyCredential`, binary members base64url." }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, description: "Present when a PKCE challenge was given." }
        "400":
          description: "`passkey_ceremony_invalid`, `passkey_verification_failed`, `passkey_ticket_invalid` or `passkey_origin_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: "`email_verification_required`: the proof was already spent on another account, or expired."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "409":
          description: "`passkey_email_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/token:
    post:
      tags: [Sign-in]
      summary: Exchange a code for a session (the app)
      description: |
        Spends the one-time code — right or wrong, a code works once — and,
        when the verifier matches its challenge, returns a session token. Not
        needed for API-key access.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code: { type: string }
                verifier: { type: string, description: "The PKCE verifier." }
      responses:
        "200":
          description: A session token and the user record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  record: { type: object }
                  meta:
                    type: object
                    properties:
                      created: { type: boolean, description: "True when the ceremony behind the code made the account, so a client can welcome someone new." }
                      passkey:
                        type: object
                        description: "The passkey that signed in."
                        properties:
                          id: { type: string }
                          name: { type: string }
                          credentialId: { type: string }
                      twoFactorSetupRequired:
                        type: boolean
                        description: "Present and true when the server requires an authenticator app and the account has none yet."
        "400":
          description: "`passkey_grant_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: |
            `two_factor_required`: the account has an authenticator app. No
            session yet; the body also carries `challenge` and `expiresAt`, and
            `POST /api/passkeys/token/2fa` completes the sign-in.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/AppError" }
                  - type: object
                    properties:
                      challenge: { type: string }
                      expiresAt: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/token/2fa:
    post:
      tags: [Sign-in]
      summary: Complete a sign-in with an authenticator code (the app)
      description: |
        Completes a sign-in that `POST /api/passkeys/token` answered with
        `401 two_factor_required`: the challenge from that answer and the
        current 6-digit code of the account's authenticator app (TOTP, RFC
        6238, one step of clock drift either way). A challenge lasts five
        minutes and allows five codes; the account allows ten codes in five
        minutes across all challenges.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string, examples: ["123456"] }
      responses:
        "200":
          description: A session token, the user record and the same `meta` as `/api/passkeys/token`.
        "400":
          description: "`two_factor_challenge_invalid`: unknown, expired, spent, or out of attempts."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: "`two_factor_code_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/2fa:
    get:
      tags: [Sign-in]
      summary: Two-factor status of the signed-in account
      security:
        - Session: []
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  required: { type: boolean, description: "The server requires it (`REQUIRE_2FA`)." }
                  setupRequired: { type: boolean, description: "Required and not yet set up: the app asks for it before anything else." }
                  enabledAt: { type: [string, "null"], format: date-time }
        "401":
          description: "`not_authenticated`: no session, or an API key."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /api/2fa/totp/setup:
    post:
      tags: [Sign-in]
      summary: Start setting up an authenticator app
      description: |
        Makes a new secret and keeps it pending until a code confirms it. The
        secret is returned here once, as text and inside an `otpauth://` URI
        for a QR code; no other endpoint returns it.
      security:
        - Session: []
      responses:
        "200":
          description: The pending secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "Base32, 160 bits." }
                  otpauthUri: { type: string }
        "401":
          description: "`not_authenticated`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "409":
          description: "`two_factor_already_enabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/2fa/totp/confirm:
    post:
      tags: [Sign-in]
      summary: Turn on the authenticator app being set up
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: >-
            The new status, as `GET /api/2fa`, plus `token`: turning it on
            ends every session of the account, the calling one included, so
            the caller continues with this one.
        "400":
          description: "`two_factor_code_invalid`, also for a code already used."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: "`not_authenticated`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "409":
          description: "`two_factor_already_enabled` or `two_factor_not_pending`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/2fa/totp:
    delete:
      tags: [Sign-in]
      summary: Turn off the authenticator app
      description: Needs a current code. Refused while the server requires two-factor authentication.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: The new status, as `GET /api/2fa`.
        "400":
          description: "`two_factor_code_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: "`not_authenticated`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: "`two_factor_enforced`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "409":
          description: "`two_factor_not_enabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/passkeys/tickets:
    post:
      tags: [Sign-in]
      summary: Issue a link to add a passkey
      description: |
        Returns a one-time link, good for fifteen minutes, to the sign-in page
        where the caller's account can register another passkey — on this
        device or, opened elsewhere, on another. Users only: an API key cannot
        let itself in as the person behind it.
      security:
        - Session: []
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/AppError" }

  /api/passkeys/{id}:
    delete:
      tags: [Sign-in]
      summary: Remove a passkey
      description: |
        Removes one of the caller's passkeys; it stops signing in at once. The
        last one cannot be removed. Passkeys are listed through
        `/api/collections/passkeys/records` (name, created, last used — never
        the key).
      security:
        - Session: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`passkey_last`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /.well-known/openid-configuration:
    get:
      tags: [OpenID Connect]
      summary: Provider metadata
      description: |
        The discovery document client libraries start from. The issuer is
        `https://<domain>`. A server reached at localhost answers as
        `http://localhost:<port>`, so a development setup with the real
        `DOMAIN` works; any other Host header falls back to the domain. Only the code flow with PKCE (S256) and public clients
        (`token_endpoint_auth_methods_supported: none`) are offered; subjects
        are pairwise.
      security: []
      responses:
        "200":
          description: The provider's metadata.
          content:
            application/json:
              schema: { type: object }

  /oidc/jwks:
    get:
      tags: [OpenID Connect]
      summary: ID-token signing keys
      description: |
        The key ID tokens are signed with (RS256). It is not the root key: it
        is a separate key the root key certifies. `revoked_certification`
        carries that certification in the format of every root-key
        statement — `payload` (base64url of a JSON body naming the domain and
        the key's RFC 7638 thumbprint as `kid`) and `signature` (hex) — so a
        client that walks the DNS pin to the root key can tie the signing key
        to the domain as well. Ordinary clients ignore the member.
      security: []
      responses:
        "200":
          description: A JSON Web Key Set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty: { type: string }
                        use: { type: string }
                        alg: { type: string }
                        kid: { type: string }
                        "n": { type: string }
                        e: { type: string }
                        revoked_certification:
                          type: object
                          properties:
                            payload: { type: string }
                            signature: { type: string }

  /oidc/authorize:
    get:
      tags: [OpenID Connect]
      summary: Authorization endpoint
      description: |
        The page a service sends the browser to. It decides nothing: it
        checks the request and opens the Revoked app with it, as a
        `revoked://signin?…` link carrying the same parameters. The person
        approves in the app (`/oidc/authorize/app`, then
        `/oidc/authorize/consent`); there is no passkey prompt or consent
        screen in the browser.

        `client_id` is the service's origin (`https://game.example`), and
        `redirect_uri` must lie on that origin. Until both check out, nothing
        is sent back: the page shows an error instead of redirecting. Every
        later refusal goes back to `redirect_uri` with `error`, `state` and
        `iss`.

        `prompt=none` always answers `login_required`, since every sign-in
        needs the person's approval in the app.
      security: []
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string }, description: The service's origin. }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - name: scope
          in: query
          required: true
          schema: { type: string }
          description: "`openid`, plus any of `profile`, `email`, `revoked_identity`."
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: prompt, in: query, schema: { type: string } }
        - name: claims
          in: query
          schema: { type: string }
          description: |
            JSON. `{"userinfo": {"revoked_links": {"values": ["shipping_address"]}}}`
            asks for vault entries by key, at most 20.
        - name: revoked_return
          in: query
          schema: { type: string, enum: [background] }
          description: |
            For the app alone. `background`: the service's page waits for the
            result, so the app hands the answer over itself, without a
            browser, and shows the check code derived from `code_challenge`.
      responses:
        "200":
          description: The page that opens the Revoked app with the request.
          content:
            text/html:
              schema: { type: string }
        "302":
          description: A refusal sent back to the service.
        "400":
          description: The service's origin or redirect address did not check out.

  /oidc/authorize/app:
    post:
      tags: [OpenID Connect]
      summary: Open a request in the app
      description: |
        Called by the Revoked app for a `revoked://signin` link, with its
        session. Checks the authorization request as the authorization
        endpoint does and returns what the consent screen shows: the
        account, what each scope would reveal, the person's entries for each
        key asked for, and a ticket for the decision.

        A request that names its service correctly but cannot go on is
        answered with `redirect` alone: the refusal, in the standard form,
        for the app to send the browser to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params]
              properties:
                params:
                  type: object
                  description: The authorization request's parameters, as the link carried them.
                  additionalProperties: { type: string }
      responses:
        "200":
          description: The consent data and a ticket, or a refusal to send back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  client: { type: string }
                  account: { type: object }
                  scopes: { type: array, items: { type: object } }
                  links: { type: array, items: { type: object } }
                  sections:
                    type: array
                    description: When entries or a name are asked for, the sections of the person's active workspace, each with its record ids.
                    items: { type: object }
                  signers:
                    type: array
                    description: The person's active identity ids, primary first, from every workspace. The app signs with one whose key it holds.
                    items: { type: string }
                  nameOptions:
                    type: array
                    description: With the `profile` scope, the names the person could give this service.
                    items: { type: object }
                  nameSelected:
                    type: object
                    description: The option to start from, when there is one.
                  redirect: { type: string }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /oidc/authorize/consent:
    post:
      tags: [OpenID Connect]
      summary: Record the decision (the app)
      description: |
        Spends the ticket; only the session that opened it can answer it.
        An approval is signed with one of the person's active identities:
        `signature` is the identity key's signature over
        `revoked-oidc-consent:` followed by the ticket. The key never leaves
        the device, so a session token alone approves nothing.

        With `approve: true`, grants `openid` plus the listed scopes that
        were asked for, and gives the service a grant over the chosen
        entries — one link per person and service, updated on every sign-in
        that shares something, with a fresh token each time. The answer is
        the address to send the browser to: with a `code`, or with
        `error=access_denied`.

        `profile` is granted only with a `name`: one of the person's identities
        or vault entries, checked to be their own. A vault entry is also shared
        under the key `name`, so the service can follow it. Leaving `name` out
        when the service asked for `profile` withdraws any name it had.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, approve]
              properties:
                ticket: { type: string }
                approve: { type: boolean }
                identityId: { type: string, description: "Required with `approve: true`." }
                signature: { type: string, description: "Base64. Required with `approve: true`." }
                scopes:
                  type: array
                  items: { type: string }
                links:
                  type: object
                  description: Requested key → an entry id from the person's active workspace. An entry under another key also gets an alias under the requested key, unless that key is taken or the entry is a file.
                  additionalProperties: { type: string }
                created:
                  type: array
                  description: Ids of entries the app saved for this sign-in, filed in the service's section. Must be the person's own and in their active workspace.
                  items: { type: string }
                name:
                  type: object
                  description: The name this service gets.
                  required: [kind, id]
                  properties:
                    kind: { type: string, enum: [identity, record] }
                    id: { type: string }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect: { type: string }
        "400":
          description: "`oidc_request_invalid`, or `oidc_link_record_invalid` for an entry that is not the person's or not in their active workspace."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: "`not_authenticated`, `identity_required`, or `signature_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: "`identity_not_owned` or `identity_revoked`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

        "409":
          description: "`oidc_sign_in_paused`: the person paused this service after the request was opened."
  /oidc/token:
    post:
      tags: [OpenID Connect]
      summary: Token endpoint
      description: |
        Redeems an authorization code. The code is spent the moment it is
        presented; `client_id`, `redirect_uri` and the PKCE verifier must
        match the authorization request. There is no client secret and no
        refresh token: the ID token proves a sign-in that just happened, and
        the service keeps its own session after that.

        The ID token (RS256, 10 minutes) carries `sub`, `aud`, `iss`, `iat`,
        `exp`, `auth_time`, `nonce`, and the claims of the granted scopes:
        `name`, `email` and `email_verified`, and `revoked_identity` (the
        fingerprint of the person's primary identity).
        `name` is the name the person chose for this service, as it stands
        when the token is issued.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, client_id, redirect_uri, code_verifier]
              properties:
                grant_type: { type: string, enum: [authorization_code] }
                code: { type: string }
                client_id: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string }
                  expires_in: { type: integer }
                  id_token: { type: string }
                  scope: { type: string }
        "400":
          description: "An OAuth error: `invalid_grant`, `unsupported_grant_type` or `invalid_request`."
        "429": { $ref: "#/components/responses/RateLimited" }

  /oidc/userinfo:
    get:
      tags: [OpenID Connect]
      summary: Userinfo endpoint
      description: |
        The claims of the granted scopes, and `revoked_links` when the person
        shared entries:

        ```json
        { "revoked_links": { "endpoint": "https://<domain>/api/grants/resolve",
            "grants": [ { "id": "…", "token": "…", "keys": ["shipping_address"] } ] } }
        ```

        The service reads the values with `POST /api/grants/resolve`, as
        often as it needs them, for as long as the person does not revoke the
        grant. The grant token is delivered here only, never in the ID token.
      security:
        - OIDCAccessToken: []
      responses:
        "200":
          description: The claims.
          content:
            application/json:
              schema: { type: object }
        "401":
          description: "`invalid_token`."
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [OpenID Connect]
      summary: Userinfo endpoint (POST)
      description: The same as the GET form.
      security:
        - OIDCAccessToken: []
      responses:
        "200":
          description: The claims.
          content:
            application/json:
              schema: { type: object }
        "401":
          description: "`invalid_token`."

  /.well-known/jwt-vc-issuer:
    get:
      tags: [Attestations]
      summary: Credential issuer metadata
      description: |
        The key this server signs credentials and status lists with, in the
        form SD-JWT VC defines for issuer metadata. `issuer` is
        `https://<domain>`, the value every credential issued here carries
        as `iss`.

        The key is ECDSA P-256 (ES256). It is not the root key: it is a
        separate key the root key certifies. `revoked_certification` carries
        that certification in the format of every root-key statement —
        `payload` (base64url of a JSON body with `type: credential-key-v1`,
        the domain, and the key's RFC 7638 thumbprint as `kid`) and
        `signature` (hex). A verifier that walked the DNS pin to the root
        key checks the certification and so ties every credential to the
        domain. A key served here without a certification under the pinned
        root key proves nothing.
      security: []
      responses:
        "200":
          description: The issuer identifier and its key set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string, description: "`https://<domain>`." }
                  jwks:
                    type: object
                    properties:
                      keys:
                        type: array
                        items:
                          type: object
                          properties:
                            kty: { type: string }
                            crv: { type: string }
                            x: { type: string }
                            "y": { type: string }
                            use: { type: string }
                            alg: { type: string }
                            kid: { type: string }
                            revoked_certification:
                              type: object
                              properties:
                                payload: { type: string }
                                signature: { type: string }

  /api/attestations/status:
    get:
      tags: [Attestations]
      summary: Status list of the credentials issued here
      description: |
        The revocation state of every credential this server issued, as one
        Token Status List: a JWT of type `statuslist+jwt`, signed with the
        credential key, whose `status_list.lst` is a zlib-compressed bit
        array, one bit per credential. A set bit means revoked. Each
        credential names its position in its `status` claim.

        A verifier reads the whole list and looks its credential up in it,
        so this server does not learn which credential was checked or by
        whom. The list is at least twice as long as the number of
        credentials issued, and positions are assigned at random.

        A revocation is never undone, and it outlives the attestation: a
        deleted attestation, or one whose workspace was deleted, stays
        revoked. A position the list does not reach says nothing about its
        credential, which is not the same as revoked.
      security: []
      responses:
        "200":
          description: |
            The status list token, as `application/statuslist+jwt`. It may be
            kept for `ttl` seconds (five minutes), which is the revocation
            latency in the usual case, and is not valid past `exp`.
          content:
            application/statuslist+jwt:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestations/offers/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: |
          The offer's one-time token, returned once in the
          `X-Attestation-Token` header when the attestation was created.
        schema: { type: string }
    get:
      tags: [Attestations]
      summary: What an offer states
      description: |
        Shows an offer to whoever holds its token, before anything is
        decided: the attesting server, the workspace, the type, and every
        claim with its value, so the subject sees what would be stated about
        them. Once the offer was accepted the claims are left out.

        `server` names the domain and root key fingerprint to walk the DNS
        chain against.
      security: []
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  label: { type: string }
                  status: { type: string, enum: [offered, active] }
                  claims:
                    type: object
                    description: Present while the offer is open.
                    additionalProperties: true
                  expiresAt: { type: string, description: When the credential stops being valid; empty for none. }
                  offerExpiresAt: { type: string, description: Until when the offer can be accepted. }
                  subjectFingerprint:
                    type: string
                    description: Set when the offer was made for one identity, or accepted by one.
                  server: { $ref: "#/components/schemas/ServerClaim" }
                  workspace:
                    type: object
                    properties:
                      name: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: |
            `attestation_offer_expired` or `attestation_offer_revoked`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestations/offers/{token}/claim:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Attestations]
      summary: Accept an offer and receive the credential
      description: |
        Issues the credential to an identity that proves its key. The caller
        is usually the subject's own server, relaying for the app
        (`POST /api/credentials/claim` there); nothing but the token and the
        proof is needed.

        The challenge comes from `GET /api/challenges/attestation/{token}`
        with the identity's id, and is signed on the device with the
        identity key. This server then checks the identity with the server
        that issued it: the certificate is the one fingerprinted, that
        server's DNS-pinned root key signed the fingerprint, and it still
        vouches for the identity. An identity issued here is checked against
        this server's own records.

        The credential is an SD-JWT VC signed with the credential key. It
        names the issuer (`iss`), the type (`vct`), the holder's key
        (`cnf.jwk`), the identity it is about (`revoked_holder`: fingerprint
        and domain) and its position in the status list (`status`). Every
        claim of the attestation is selectively disclosable.

        An offer is accepted once. The identity that accepted it may claim
        it again until the offer's date and receives the same statement
        again, so a lost answer costs nothing; any other identity is refused
        with `attestation_offer_claimed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, challengeNonce, challengeSignature]
              properties:
                identity:
                  type: object
                  description: The public half of the subject's identity.
                  properties:
                    id: { type: string, description: The identity's id on its own server; the id the challenge was issued for. }
                    name: { type: string }
                    fingerprint: { type: string }
                    certificate: { type: string }
                    parentSignature: { type: string }
                    domainAtIssue: { type: string }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
      responses:
        "200":
          description: The credential, with every disclosure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential: { type: string, description: "`<issuer JWT>~<disclosure>~…~`" }
                  issuer: { type: string, description: The attesting domain. }
        "400": { $ref: "#/components/responses/AppError" }
        "401":
          description: |
            `challenge_required`, `challenge_invalid` or `signature_invalid`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: |
            `remote_identity_invalid` when the identity could not be verified
            with the server that issued it, `identity_revoked` when that
            server withdrew it, `attestation_identity_mismatch` when the
            offer was made for another identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: |
            `attestation_offer_claimed`, `attestation_offer_expired` or
            `attestation_offer_revoked`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestations/verify:
    post:
      tags: [Attestations]
      summary: Verify a presented credential
      description: |
        Checks a presentation along both chains and answers with a verdict.

        The attester's chain: the issuer's domain is read from `iss`, its
        root key is tied to the domain through the `_revoked` TXT record,
        the credential key is checked against the root key's certification,
        the credential's signature against that key, and its position in the
        issuer's status list.

        The holder's chain: the key binding is checked against the key the
        credential names, for the `audience` and `nonce` given here, and the
        server that issued the holder's identity is asked whether that
        identity still stands.

        The verdict states who attested and what was disclosed. It does not
        decide whether the attester deserves to be believed: which domains
        are accepted for which statement is the caller's policy.

        Without `audience` and `nonce` no key binding is checked, and the
        verdict is never `verified`: a credential without a key binding
        could be presented by anyone holding a copy. A service chooses a
        fresh nonce for every request and passes its own origin as audience.

        Always answers `200`; a presentation that cannot be read is the
        verdict `invalid`, and a check that could not be completed is
        `unverified`, never an error to ignore.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presentation]
              properties:
                presentation:
                  type: string
                  description: "`<issuer JWT>~<disclosure>~…~<key binding JWT>`"
                audience: { type: string, description: The verifier as the presentation names it, e.g. its origin. }
                nonce: { type: string, description: The value the verifier chose for this occasion. }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttestationVerdict" }
        "400": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestations/reissue:
    post:
      tags: [Attestations]
      summary: Move a credential to the holder's new identity
      description: |
        Issues a credential this server issued again, for another identity
        of its holder, and revokes the one it replaces. The caller is usually
        the holder's own server, relaying for the app
        (`POST /api/credentials/{id}/reissue` there). Nobody at the issuer
        is asked: the key the credential is bound to authorizes the move.

        The request carries the credential as issued (without a key
        binding), the public half of the new identity, the new identity's
        signature over a challenge from
        `GET /api/challenges/reissue/{old fingerprint}?identityId=<new id>`,
        and a voucher signed with the key in the credential's `cnf`.

        This server checks, in this order: its own signature on the
        credential, and that the credential is in date; that its position in
        the status list is not revoked and the attestation still names this
        holder; that the new identity comes from the same server as the old
        one and is another identity; the voucher; the challenge, which is
        spent here; the new identity with the server that issued it, as for a
        claim; and that the old identity still stands there. Revoking the old
        identity therefore ends its key's say: nothing bound to it can be
        moved after that.

        The new credential states the same claims and type, with the same
        issue and expiry dates, bound to the new key, at a fresh position in
        the status list. The old position is revoked in the same
        transaction, and the attestation names the new identity as its
        subject. A credential moves once; moving it to yet another identity
        is refused with `reissue_credential_revoked`. Moving it again to the
        identity it already moved to hands out the current credential once
        more, so a lost answer is fetched by retrying.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, identity, challengeNonce, challengeSignature, voucher]
              properties:
                credential:
                  type: string
                  description: "The credential as issued: `<issuer JWT>~<disclosure>~…~`."
                identity:
                  type: object
                  description: The public half of the identity the credential moves to.
                  properties:
                    id: { type: string, description: The identity's id on its own server; the id the challenge was issued for. }
                    name: { type: string }
                    fingerprint: { type: string }
                    certificate: { type: string }
                    parentSignature: { type: string }
                    domainAtIssue: { type: string }
                challengeNonce: { type: string }
                challengeSignature: { type: string, description: The new identity key's signature over the nonce. }
                voucher: { $ref: "#/components/schemas/ReissueVoucher" }
      responses:
        "200":
          description: The new credential, with every disclosure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential: { type: string, description: "`<issuer JWT>~<disclosure>~…~`" }
                  issuer: { type: string, description: The attesting domain. }
        "400":
          description: |
            `reissue_credential_invalid` when the credential was not issued
            here or cannot be read, `identity_required` without an identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "401":
          description: |
            `reissue_voucher_invalid` when the voucher is missing, signed by
            another key or states something else, `challenge_required`,
            `challenge_invalid` or `signature_invalid`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "403":
          description: |
            `reissue_identity_mismatch` when the new identity is the old one
            or comes from another server, `remote_identity_invalid` or
            `identity_revoked` for the new identity, `reissue_holder_revoked`
            when the old identity was revoked, `reissue_holder_unconfirmed`
            when its server could not confirm it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "410":
          description: |
            `reissue_credential_revoked` when the credential was revoked or
            already moved, `reissue_credential_expired` when it has expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestation-checks:
    post:
      tags: [Attestations]
      summary: Ask someone to show an attestation
      description: |
        Makes a check: this server stands in for the service that would
        otherwise ask. The answer is a `present` query for an ordinary
        `revoked://present` link, whose audience is this server's origin,
        whose nonce is the check's own and whose state is the check's id.
        The other person answers it like any request to see an attestation;
        the answer lands at `POST /api/public/attestation-checks/answer`.

        A check can be answered once, for ten minutes. `identityId` names
        the asker as the other person sees them; it must be one of the
        caller's own active identities. Requires a `users` session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, description: The kind of attestation asked for. Empty asks for any. }
                issuers: { type: array, items: { type: string }, description: Attester domains accepted. }
                claims: { type: array, items: { type: string }, description: Claims asked for. }
                identityId: { type: string, description: The asker's identity, shown to the other person. }
                connection: { type: string, description: "The connected tool whose proposal this check came from: one of the caller's own live connections. Lets the tool see the verdict." }
                ref: { type: string, description: "The tool's own reference, up to 80 characters." }
      responses:
        "200":
          description: The check, and the query of the link that answers it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  expiresAt: { type: string, format: date-time }
                  present:
                    type: object
                    additionalProperties: { type: string }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/public/attestation-checks/{id}:
    get:
      tags: [Attestations]
      summary: Who asks to see an attestation
      description: |
        Read by the answering app before anything is shown: the asker's
        identity, stated as a request's requester is, and this server's
        domain, so the app checks the asker along the same trust chain.
        Answers only while the check is open.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The asker.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asker: { type: object }
                  expiresAt: { type: string, format: date-time }
                  server: { type: object }
        "404": { $ref: "#/components/responses/AppError" }
        "410": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/public/attestation-checks/answer:
    post:
      tags: [Attestations]
      summary: Answer a check with a presentation
      description: |
        The `response_uri` of a check's present link. The presentation is
        verified against the check's audience and nonce on arrival, and the
        verdict is kept for the asker; the credential is not. Something that
        is not a presentation, or one made for another verifier, is refused
        without using the check up. The first answer that verifies as a
        presentation closes it: a second gets `410`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presentation, state]
              properties:
                presentation: { type: string }
                state: { type: string, description: The check's id. }
      responses:
        "200":
          description: Kept. `state` is the verdict's state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
        "400": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/AppError" }
        "410": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestation-shares:
    post:
      tags: [Attestations]
      summary: Start a link that shows a held attestation
      description: |
        Starts a link for one of the caller's held attestations, open for
        `days` (1 to 90). The answer is the audience and nonce the holder's
        presentation must be bound to; the link opens once
        `POST /api/attestation-shares/{id}/activate` receives one that
        verifies, within ten minutes. Requires a `users` session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, days]
              properties:
                credential: { type: string, description: The id of one of the caller's credentials. }
                days: { type: integer, minimum: 1, maximum: 90 }
      responses:
        "200":
          description: The pending link and what to bind the presentation to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  audience: { type: string }
                  nonce: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/attestation-shares/{id}/activate:
    post:
      tags: [Attestations]
      summary: Sign a pending link and open it
      description: |
        Takes the holder's presentation for a pending link. It must be bound
        to the link's audience and nonce, made by the identity the
        attestation was issued to, and the attestation must still stand.
        The answer carries the link; only a hash of its token is kept, so it
        is shown this once. A link is signed once: a second attempt gets
        `410`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presentation]
              properties:
                presentation: { type: string }
      responses:
        "200":
          description: The open link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
                  disclosed: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/AppError" }
        "410": { $ref: "#/components/responses/AppError" }

  /api/attestation-shares/{id}/revoke:
    post:
      tags: [Attestations]
      summary: End a link
      description: Ends one of the caller's links. Whoever opens it afterwards gets `410`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/AppError" }

  /api/public/attestation-shares/{token}:
    get:
      tags: [Attestations]
      summary: Read a shared attestation
      description: |
        What a link shows: the verdict on the holder's presentation, checked
        again now. The key binding was checked when the holder signed the
        link; the issuer's key, the status list, expiry and the holder's
        identity are checked on every read. The link shows what the holder
        chose to share; it does not prove that whoever sent it is the
        holder. Each read is counted for the holder.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The verdict, with when the link was made and until when it is open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  reason: { type: string }
                  issuer: { type: string }
                  type: { type: string }
                  claims: { type: object }
                  withheld: { type: integer }
                  holder: { type: object }
                  holderName: { type: string }
                  sharedAt: { type: string, format: date-time }
                  linkExpiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/AppError" }
        "410": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /p/{token}:
    get:
      tags: [Attestations]
      summary: A shared attestation, as a page
      description: |
        The link a holder passes on. A browser gets a page; anything else
        gets the JSON of `GET /api/public/attestation-shares/{token}`.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The page, or the verdict as JSON.
        "404": { $ref: "#/components/responses/AppError" }
        "410": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/credentials/claim:
    post:
      tags: [Attestations]
      summary: Accept an offer and keep the credential
      description: |
        Accepts an attestation offer for the person signed in here and keeps
        the credential for them. This is what the app calls; the offer may
        live on this server or on any other.

        The app obtains the challenge from the offer's server and signs it on
        the device. This server adds the identity's public half, calls the
        offer's server, and checks what comes back before keeping it: the
        server that was asked signed it, with a key tied to its domain, and
        it is bound to the key and the identity that asked. A credential
        that fails this is not kept, and `credential_invalid` is returned;
        the offer can be accepted again.

        `origin` is the address of the offer's server and is left out for an
        offer on this server. Accepting an offer again replaces the kept
        copy.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, identityId, challengeNonce, challengeSignature]
              properties:
                origin:
                  type: string
                  description: |
                    The other server's address, e.g. `https://verify.example`.
                    Plain `http` is accepted only for a domain listed in
                    `PEER_OVERRIDES`.
                token: { type: string }
                identityId: { type: string, description: An identity of the signed-in person on this server. }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
      responses:
        "200":
          description: The kept credential, as its `credentials` record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  issuer: { type: string, description: The attesting domain. }
                  type: { type: string }
                  identity: { type: string }
                  credential: { type: string, description: The SD-JWT with every disclosure. }
                  claims: { type: object, additionalProperties: true }
                  issuedAt: { type: string }
                  expiresAt: { type: string }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: |
            `remote_unreachable` when the other server could not be reached,
            `credential_invalid` when what it returned did not verify.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /api/credentials/{id}/status:
    get:
      tags: [Attestations]
      summary: Whether a held credential still stands
      description: |
        The holder's view of a credential they keep: the same checks as
        `POST /api/attestations/verify`, without a key binding, since
        nothing is being presented. It tells whether the attester's key
        still verifies, whether the credential was revoked or has expired,
        and whether the identity it is bound to still stands.
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The verdict. `keyBound` is always false here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttestationVerdict" }
        "401": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/credentials/{id}/reissue:
    parameters:
      - name: id
        in: path
        required: true
        description: A credential the signed-in person keeps.
        schema: { type: string }
      - name: identityId
        in: query
        description: The identity it moves to, for `GET`. `POST` names it in the body.
        schema: { type: string }
    get:
      tags: [Attestations]
      summary: The issuer's challenge for moving a held credential
      description: |
        Fetches a challenge from the credential's issuer — this server when
        it issued the credential — for moving it to `identityId`, another
        active identity of the signed-in person. The app knows an issuer by
        its domain only, so this server reaches it on the app's behalf.

        The app signs the nonce with the new identity's key, and builds the
        voucher itself from what it knows: the issuer, the two fingerprints
        and this nonce. Nothing else is taken from the answer.
      security:
        - Session: []
      responses:
        "200":
          description: A nonce to sign.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/AppError" }
        "403":
          description: |
            `identity_not_owned`, `identity_revoked` or
            `reissue_identity_mismatch` for the identity it moves to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "404":
          description: "`credential_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`remote_unreachable` when the issuer could not be reached."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
    post:
      tags: [Attestations]
      summary: Move a held credential to another identity
      description: |
        Moves a credential the signed-in person keeps to another of their
        identities, and keeps the replacement in place of the old copy. This
        is what the app calls for each credential when an identity is
        replaced.

        Both signatures are made on the device: the voucher with the key of
        the identity the credential is bound to, the challenge with the new
        one. This server adds the credential and the new identity's public
        half, calls the issuer (`POST /api/attestations/reissue`, on this
        server or the issuer's), and checks what comes back as it checks an
        accepted offer: the issuer signed it with a key tied to its domain,
        and it is bound to the new key and identity. A refusal from the
        issuer is passed on with its code; the credential then stays bound to
        the old identity.
      security:
        - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId, challengeNonce, challengeSignature, voucher]
              properties:
                identityId: { type: string, description: The identity it moves to. }
                challengeNonce: { type: string }
                challengeSignature: { type: string }
                voucher: { $ref: "#/components/schemas/ReissueVoucher" }
      responses:
        "200":
          description: The kept credential, as its `credentials` record, now bound to the new identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  issuer: { type: string, description: The attesting domain. }
                  type: { type: string }
                  identity: { type: string }
                  credential: { type: string, description: The SD-JWT with every disclosure. }
                  claims: { type: object, additionalProperties: true }
                  issuedAt: { type: string }
                  expiresAt: { type: string }
        "400": { $ref: "#/components/responses/AppError" }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
        "404":
          description: "`credential_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }
        "410": { $ref: "#/components/responses/AppError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: |
            `remote_unreachable` when the issuer could not be reached,
            `credential_invalid` when what it returned did not verify.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /api/collections/{collection}/records:
    parameters:
      - $ref: "#/components/parameters/Collection"
    get:
      tags: [Records]
      summary: List records
      description: |
        For the owner-only `bookmarks` collection, optional `sealedKey`
        and `keyEpoch` retain an address key wrapped under the owner's account
        key. They are either empty/zero, or a version-1 AEAD envelope of 32
        bytes at a positive epoch. Request bookmarks cannot carry these fields.
        The associated-data format and local replay checks are documented in
        `/api/encrypted-links/`. Raw address keys are never stored here.

        Standard record listing. Results are already narrowed to what the
        caller may see, so an empty page means "nothing you can read", not
        "nothing exists".
      parameters:
        - name: filter
          in: query
          description: PocketBase filter expression.
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: A page of records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  perPage: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
                  items: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/AppError" }
        "403": { $ref: "#/components/responses/AppError" }
    post:
      tags: [Records]
      summary: Create a record
      description: |
        Field requirements vary by collection; see the reference table in the
        Records guide. Two rules hold everywhere:

        - An `identity` relation is ownership-checked. Attaching an identity
          you do not own is refused — identity ids are public, and attaching a
          foreign one is exactly the impersonation this product exists to stop.
        - Vault records are created here; request-collected rows are minted
          server-side and never through this endpoint.

        A share bookmark can include `sealedKey` and `keyEpoch`: an address
        key wrapped under its owner's account key, never the raw `#k=` key.
        Both must be empty/zero or a correctly sized version-1 envelope at a
        positive epoch. Request bookmarks cannot carry them. The cryptographic
        context is described in the Encrypted links and saved keys guide.

        File records are sent as `multipart/form-data` with the bytes in a
        `file` part. Stream them: the operator's size cap is advertised at
        `GET /api/server` under `limits.maxFileSize`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              additionalProperties: true
      responses:
        "200":
          description: The created record.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/AppError" }
        "403":
          description: |
            Refused with a named reason — which scope is missing, which
            workspace a key is bound to — rather than a bare denial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppError" }

  /api/collections/{collection}/records/{id}:
    parameters:
      - $ref: "#/components/parameters/Collection"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Records]
      summary: Read one record
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Records]
      summary: Update a record
      description: |
        Updating a record updates every share that points at it, on their next
        read — that is the rotation gesture, not a side effect.

        Bookmark `sealedKey` and `keyEpoch` change together; clearing them
        uses an empty key and epoch zero. The owner-only rules still apply.

        Some transitions are one-way: an identity may go from active to
        revoked and never back, because a revocation is a statement already
        published to verifiers who may have cached it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              additionalProperties: true
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Records]
      summary: Delete a record
      description: |
        Deleting a workspace takes its entire contents with it — records,
        files, templates, members, API keys — and revokes the identities it
        issued, leaving tombstones so those certificates stop verifying.

        Deleting an identity likewise leaves a tombstone, so its fingerprint
        keeps resolving to a definite answer rather than to silence.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/AppError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/files/token:
    post:
      tags: [Records]
      summary: Mint a file access token
      description: |
        File fields are protected, so a bare file URL serves nothing. This
        returns a short-lived token to append to a file request as `?token=`.
        For files reached through a share, use the `downloadToken` from the
        resolve instead.
      responses:
        "200":
          description: A file access token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401": { $ref: "#/components/responses/AppError" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Programmatic access. Sending a key as a Bearer token authenticates as
        nobody — the request is treated as a guest and refused by the rules.
    Session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A session token from sign-in. Used by the app.
    Connection:
      type: apiKey
      in: header
      name: X-Revoked-Connection
      description: A connected tool's token, from `/api/connect/token`.
    OIDCAccessToken:
      type: http
      scheme: bearer
      description: An access token from `/oidc/token`, valid for one hour.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: |
        The capability. Unguessable by construction and never derived from
        anything user-visible — whoever holds it holds the access.
      schema: { type: string }
    Collection:
      name: collection
      in: path
      required: true
      description: Which collection to act on.
      schema:
        type: string
        enum:
          - records
          - sections
          - links
          - requests
          - templates
          - identities
          - workspaces
          - workspaceMembers
          - invites
          - apiKeys
          - notifications
          - bookmarks
          - bookmarkGroups
          - passkeys
          - reminders
          - attestations
          - credentials

  responses:
    NotFound:
      description: No such resource, or the caller may not see it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AppError" }
    AppError:
      description: Refused, with a named reason.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AppError" }
    RateLimited:
      description: |
        Too many attempts. Password gates, probes and challenges are limited
        per client, so a slug cannot be brute-forced.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AppError" }

  schemas:
    ReissueVoucher:
      type: object
      description: |
        The old identity key's word that another identity takes over a
        credential. `payload` is the exact bytes signed, as base64url without
        padding; they are this JSON, with `type` first:

        ```json
        { "type": "credential-reissue-v1", "issuer": "<issuer domain>",
          "oldFingerprint": "<identity the credential is bound to>",
          "newFingerprint": "<identity it moves to>", "nonce": "<the challenge>" }
        ```

        `signature` is made like a challenge signature, over the SHA-256 of
        the payload bytes: base64 of PKCS#1 v1.5 for an RSA key, of ASN.1 DER
        for an ECDSA P-256 key. It is checked under the key in the
        credential's `cnf.jwk`. The type tag keeps a voucher apart from
        everything else the identity key signs.
      required: [payload, signature]
      properties:
        payload: { type: string }
        signature: { type: string }
    AttestationVerdict:
      type: object
      description: |
        The result of checking a credential. `state` is the answer;
        the other fields say what it rests on.

        | `state` | Meaning |
        |---|---|
        | `verified` | Both chains hold and the holder presented it. |
        | `unverified` | A check could not be completed: the issuer or the holder's server was unreachable, the status list does not reach the credential, or no key binding was checked. |
        | `dnsMissing` | The issuer publishes no `_revoked` TXT record. |
        | `spoofed` | The credential is not signed by a key the issuer's DNS-pinned root key certified. |
        | `revoked` | The credential is genuine, and the issuer revoked it or the holder's identity was withdrawn. |
        | `expired` | The credential is genuine and past its own validity. |
        | `invalid` | Not a readable credential, or the key binding does not verify. |
      properties:
        state:
          type: string
          enum: [verified, unverified, dnsMissing, spoofed, revoked, expired, invalid]
        reason: { type: string, description: The first reason the credential was held back, or what was verified. }
        issuer: { type: string, description: The attesting domain. }
        issuerState: { type: string, description: How the issuer's key was tied to its domain. }
        type: { type: string, description: The credential's `vct`. }
        claims:
          type: object
          description: The disclosed claims. Left out unless the issuer's signature verified.
          additionalProperties: true
        withheld: { type: integer, description: How many claims the credential holds that were not disclosed. }
        status: { type: string, enum: [valid, revoked, unknown], description: What the issuer's status list says. }
        issuedAt: { type: integer, description: Unix seconds. }
        expiresAt: { type: integer, description: Unix seconds; absent when the credential does not expire. }
        holder:
          type: object
          description: The identity the credential was issued to.
          properties:
            fingerprint: { type: string }
            domain: { type: string }
            state: { type: string, description: "verified, revoked, dnsMissing, spoofed, or unverified when its server could not be asked." }
            status: { type: string, description: "That server's own word: active, revoked or unknown." }
        keyBound:
          type: boolean
          description: Whether the presentation proved possession of the holder's key for the audience and nonce given.
    AppError:
      type: object
      description: |
        The stable error envelope. Key off `code`, never off `message` — the
        prose may change, the code will not.

        Messages may echo what the caller sent, never server-held state: an
        error outlives the credential that produced it and lands in logs and
        screenshots read by people who hold no key.
      properties:
        code: { type: string, examples: ["link_password_required"] }
        message: { type: string }
        status: { type: integer }
    Permission:
      type: object
      properties:
        key: { type: string, examples: ["settings:manage"] }
        label: { type: string }
        description: { type: string }
        destructive:
          type: boolean
          description: Whether holding it lets someone extend or revoke other people's access.
        membersOnly:
          type: boolean
          description: |
            Held across the whole workspace only by a member. An API key or a
            connected tool holds a vault permission only within the sections
            chosen for it: creating a key with one and no `sections`, or with
            a raw record scope, fails with `api_key_vault_scope`.
        scopes:
          type: array
          description: What the permission expands to when stored.
          items: { type: string }
    Feature:
      type: object
      properties:
        key: { type: string, examples: ["sharing"] }
        label: { type: string }
        description: { type: string }
        permission:
          type: string
          description: |
            The permission the feature is pointless without, or empty. A
            client hides the feature from a member who lacks it; holding the
            feature never grants the permission.
        defaultOn:
          type: boolean
          description: Whether an account that never chose sees it.
    FeaturePreset:
      type: object
      description: |
        A kind of member an invite can be made for: the permissions it grants
        and the features it starts the member on. The server stores the two
        expanded lists; the preset's name is never kept.
      properties:
        key: { type: string, examples: ["vault-sharing"] }
        label: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        features:
          type: array
          items: { type: string }
    Member:
      type: object
      properties:
        id: { type: string }
        user: { type: string }
        email: { type: string }
        features:
          type: array
          description: |
            What the member chose to see, or the catalogue's defaults while
            they never chose. Display only: gate on permissions.
          items: { type: string }
        role:
          type: string
          enum: [admin, member]
          description: |
            Derived, never chosen: set to `admin` exactly when the member may
            invite. Gate on permissions, not on this.
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        isSelf: { type: boolean }
        isLastAdmin:
          type: boolean
          description: Removing them would leave the workspace unadministrable.
        joined: { type: string, format: date-time }
    ServerClaim:
      type: object
      description: What the serving domain claims about itself. Verify it against DNS.
      properties:
        domain: { type: string }
        rootFingerprint: { type: string }
    Sharer:
      type: object
      description: |
        The identity behind a share or request. Every field here is a *claim*
        until the chain is walked: fetch the named domain's root key, confirm
        it against DNS, verify `parentSignature`, then ask the issuer whether
        the identity still stands.
      properties:
        identityId: { type: string }
        name: { type: string }
        fingerprint: { type: string }
        parentSignature: { type: string }
        domainAtIssue: { type: string }
        status: { type: string, enum: [active, revoked] }
        statusAssertion:
          allOf:
            - $ref: "#/components/schemas/IdentityStatusAssertion"
          description: |
            The issuer's signed answer, stapled so a verifier need not make a
            second round trip.
    IdentityStatusAssertion:
      type: object
      description: A root-signed statement about one fingerprint.
      properties:
        payload:
          type: string
          description: |
            Base64url JSON. Its first field is `type: identity-status-v1`,
            which is what stops the endpoint being a signing oracle.
        signature: { type: string, description: Root key signature over the payload. }
    TemplateItem:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string }
        format: { type: string }
        required: { type: boolean }
        reason: { type: string, description: Why the requester is asking for it. }
        records:
          type: array
          description: Present when this item is a section.
          items: { $ref: "#/components/schemas/TemplateItem" }
