<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" aria-labelledby="t d">
  <title id="t">How traffic reaches a Revoked server</title>
  <desc id="d">Public HTTPS traffic reaches the revoked-api container through one of three reverse proxy options: the bundled Caddy, a proxy on the host forwarding to port 3000, or a proxy in its own container joined over a Docker network. The container is published on 127.0.0.1:3000 only. The superuser dashboard is reachable only locally or over an SSH tunnel.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; }
    .neutral rect { fill: #F1EFE8; stroke: #888780; }
    .neutral .th { fill: #2C2C2A; }
    .neutral .ts { fill: #5F5E5A; }
    .proxy rect { fill: #EEEDFE; stroke: #534AB7; }
    .proxy .th { fill: #3C3489; }
    .proxy .ts { fill: #534AB7; }
    .api rect { fill: #E1F5EE; stroke: #0F6E56; }
    .api .th { fill: #085041; }
    .api .ts { fill: #0F6E56; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .neutral rect { fill: #444441; stroke: #B4B2A9; }
      .neutral .th { fill: #F1EFE8; }
      .neutral .ts { fill: #D3D1C7; }
      .proxy rect { fill: #3C3489; stroke: #AFA9EC; }
      .proxy .th { fill: #EEEDFE; }
      .proxy .ts { fill: #CECBF6; }
      .api rect { fill: #085041; stroke: #5DCAA5; }
      .api .th { fill: #E1F5EE; }
      .api .ts { fill: #9FE1CB; }
      .arr { stroke: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="neutral">
    <rect x="240" y="30" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Internet (HTTPS)</text>
  </g>

  <path class="arr" d="M340 74 L340 100 L130 100 L130 128" marker-end="url(#arrow)"/>
  <line class="arr" x1="340" y1="74" x2="340" y2="128" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 74 L340 100 L550 100 L550 128" marker-end="url(#arrow)"/>

  <g class="proxy">
    <rect x="40" y="130" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="149" text-anchor="middle" dominant-baseline="central">A · Bundled Caddy</text>
    <text class="ts" x="130" y="168" text-anchor="middle" dominant-baseline="central">Auto HTTPS, one flag</text>
  </g>
  <g class="proxy">
    <rect x="250" y="130" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="149" text-anchor="middle" dominant-baseline="central">B · Proxy on host</text>
    <text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">Forwards to :3000</text>
  </g>
  <g class="proxy">
    <rect x="460" y="130" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="149" text-anchor="middle" dominant-baseline="central">C · Proxy in Docker</text>
    <text class="ts" x="550" y="168" text-anchor="middle" dominant-baseline="central">Joins via override</text>
  </g>

  <line class="arr" x1="130" y1="186" x2="130" y2="248" marker-end="url(#arrow)"/>
  <line class="arr" x1="340" y1="186" x2="340" y2="248" marker-end="url(#arrow)"/>
  <line class="arr" x1="550" y1="186" x2="550" y2="248" marker-end="url(#arrow)"/>

  <g class="api">
    <rect x="40" y="250" width="600" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="269" text-anchor="middle" dominant-baseline="central">revoked-api container</text>
    <text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central">Always 127.0.0.1:3000 on the host</text>
  </g>

  <g class="neutral">
    <rect x="40" y="350" width="260" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="170" y="369" text-anchor="middle" dominant-baseline="central">Admin dashboard /_/</text>
    <text class="ts" x="170" y="388" text-anchor="middle" dominant-baseline="central">Local or SSH tunnel only</text>
  </g>
  <line class="arr" x1="170" y1="350" x2="170" y2="308" marker-end="url(#arrow)"/>
</svg>
