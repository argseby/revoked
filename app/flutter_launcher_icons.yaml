# Launcher icons for every platform, generated from the logo SVGs in
# assets/icon/. Run ./tool/generate_icons.sh rather than this config directly:
# it renders the build/icon/*.png sources below first.
flutter_launcher_icons:
  image_path: "build/icon/app_icon.png"

  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "build/icon/app_icon_mark.png"
  adaptive_icon_monochrome: "build/icon/app_icon_mark.png"

  ios: true
  # iOS rejects icons with an alpha channel.
  remove_alpha_ios: true
  # iOS is the one platform that switches icons with the system theme.
  image_path_ios: "build/icon/app_icon_light.png"
  image_path_ios_dark_transparent: "build/icon/app_icon_mark.png"

  macos:
    generate: true
    image_path: "build/icon/app_icon_desktop.png"

  windows:
    generate: true
    image_path: "build/icon/app_icon_desktop.png"
    icon_size: 256
