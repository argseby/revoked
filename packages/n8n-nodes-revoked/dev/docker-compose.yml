# A local n8n with this package loaded, for a Revoked server on the same machine.
# Host networking lets n8n reach the server on localhost and the server reach
# n8n's webhook address; the server needs ALLOW_PRIVATE_CALLBACKS=true for that.
services:
  n8n:
    image: n8nio/n8n:2.39.8
    container_name: n8n-revoked-dev
    network_mode: host
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/exports
    volumes:
      - n8n_data:/home/node/.n8n
      - ..:/home/node/.n8n/custom/node_modules/@kiunke.dev/n8n-nodes-revoked:ro
      - ./exports:/home/node/exports

volumes:
  n8n_data:
