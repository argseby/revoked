name: revoked_sign_in
description: The official "Continue with Revoked" button for Flutter, with the panel that shows the QR code and check code and waits for the approval.
version: 0.1.1
homepage: https://revoked.link
repository: https://github.com/argseby/revoked/tree/main/packages/revoked_sign_in
issue_tracker: https://github.com/argseby/revoked/issues
documentation: https://docs.revoked.link/api/sign-in/
topics:
  - authentication
  - sign-in
  - openid-connect
  - accessibility
  - button

environment:
  sdk: ^3.11.5
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  qr: ^4.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
