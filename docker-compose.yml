# revoked — API stack.
#
#   cp .env.example .env    # DOMAIN is required — the server refuses to boot without it
#   docker compose up -d
#   docker compose logs api # prints the _revoked TXT record to publish
#
# The API answers at http://127.0.0.1:3000 on this machine and nowhere else.
# Public HTTPS reaches it one of three ways (docs/installation/reverse-proxy.md):
#
#   A  the bundled Caddy, with automatic HTTPS for DOMAIN:
#        docker compose --profile caddy up -d
#   B  a reverse proxy running on this host, forwarding to http://127.0.0.1:3000
#   C  a reverse proxy in its own container (Nginx Proxy Manager, Traefik),
#      on a Docker network it already has:
#        docker compose -f docker-compose.yml -f docker-compose.network.yml up -d
#
# The superuser dashboard (/_/) answers only requests that reach the container
# directly, never through the proxy: over an SSH tunnel to port 3000.
#
# Variables are mapped explicitly rather than through `env_file:` so this works
# unchanged under Portainer, which passes stack variables as environment and
# writes no .env of its own. The CLI reads ./.env for these automatically.

services:
  api:
    # The release image, with its version stamped in. This file never builds:
    # a host that once built the checkout under this name kept that unstamped
    # copy and reported `dev`. Builds from source go through
    # docker-compose.build.yml. Pinning a release
    # (ghcr.io/argseby/revoked:v0.35.0) makes an upgrade a deliberate change
    # of tag.
    image: ${REVOKED_IMAGE:-ghcr.io/argseby/revoked:latest}
    # Every `up` checks the registry, so :latest moves on a plain redeploy
    # (Portainer included) and a stale local copy never shadows the release.
    pull_policy: always
    container_name: ${CONTAINER_NAME:-revoked-api}
    restart: unless-stopped
    ports:
      - "${API_PUBLISH:-127.0.0.1:3000}:${API_PORT:-3000}"
    environment:
      DOMAIN: ${DOMAIN}
      # Explicit: main.go otherwise resolves this against the working
      # directory, which only happens to match --dir.
      SERVER_KEY_PATH: /pb/pb_data/server_root.pem
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USER_EMAIL: ${USER_EMAIL:-}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-false}
      SIGNUP_VERIFY_EMAIL: ${SIGNUP_VERIFY_EMAIL:-false}
      REQUIRE_2FA: ${REQUIRE_2FA:-false}
      GRANT_EMAIL_RECIPIENTS: ${GRANT_EMAIL_RECIPIENTS:-off}
      ALLOW_ATTESTATIONS: ${ALLOW_ATTESTATIONS:-false}
      APP_STORE_URL: ${APP_STORE_URL:-}
      PLAY_STORE_URL: ${PLAY_STORE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-}
      ALLOW_PRIVATE_CALLBACKS: ${ALLOW_PRIVATE_CALLBACKS:-false}
      # Megabytes; unset means unlimited, 0 disables uploads. Keep
      # FILE_MAX_SIZE at or under the proxy's client_max_body_size, or an
      # oversized upload dies at the proxy instead of returning the API's
      # typed refusal.
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-}
      FILE_MAX_STORAGE: ${FILE_MAX_STORAGE:-}
      # A path inside the container: mount the file there as well.
      BLOCKED_DOMAINS_FILE: ${BLOCKED_DOMAINS_FILE:-}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-2048}
      RATELIMIT_GATE_ATTEMPTS: ${RATELIMIT_GATE_ATTEMPTS:-10}
      RATELIMIT_PROBE_REQUESTS: ${RATELIMIT_PROBE_REQUESTS:-120}
      RATELIMIT_CHALLENGE_REQUESTS: ${RATELIMIT_CHALLENGE_REQUESTS:-60}
      RATELIMIT_PASSKEY_REQUESTS: ${RATELIMIT_PASSKEY_REQUESTS:-60}
      RATELIMIT_SIGNUP_EMAILS: ${RATELIMIT_SIGNUP_EMAILS:-10}
      RATELIMIT_SUBMISSIONS: ${RATELIMIT_SUBMISSIONS:-60}
      RATELIMIT_GRANT_EMAILS: ${RATELIMIT_GRANT_EMAILS:-5}
      RATELIMIT_WORKSPACE_EMAILS: ${RATELIMIT_WORKSPACE_EMAILS:-30}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-X-Forwarded-For}
      DASHBOARD_ACCESS: ${DASHBOARD_ACCESS:-local}
    command:
      - serve
      - --http=0.0.0.0:${API_PORT:-3000}
      - --dir=/pb/pb_data
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:${API_PORT:-3000}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - pb_data:/pb/pb_data

  # Path A: public HTTPS without a proxy of your own. Caddy obtains and renews
  # the certificate for DOMAIN itself, so ports 80 and 443 must be reachable
  # from the internet and DOMAIN must point at this machine.
  caddy:
    profiles: [caddy]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # The address Caddy serves and gets a certificate for. DOMAIN unless
      # set: `localhost` serves a local test with Caddy's own certificate.
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      API_PORT: ${API_PORT:-3000}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account: kept, so a restart does not
      # ask Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Losing this volume means losing the CA key, and every identity this server
  # ever issued stops verifying. Back it up.
  pb_data:
  caddy_data:
  caddy_config:
