name: App builds
on:
  # Called by release.yml straight after it tags. A tag pushed with
  # GITHUB_TOKEN raises no push event — GitHub suppresses it to stop workflows
  # triggering each other — so waiting for `push: tags` never fired.
  workflow_call:
    inputs:
      tag:
        description: Tag to attach the builds to.
        type: string
        required: true
  # For a tag pushed by a person, which is not suppressed.
  push:
    tags: ['v*']
  # Manual run. Give it an existing tag to attach the builds to that release;
  # leave it empty to just build and leave the artifacts on the run summary.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish to (e.g. v0.2.0). Empty = build only.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release

      - name: Package
        run: |
          BUNDLE=build/linux/x64/release/bundle
          cp -r packaging/linux "$BUNDLE/packaging"
          tar -C "$BUNDLE" -czf "revoked-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: revoked-linux-x64
          path: app/revoked-linux-x64.tar.gz

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item -Recurse packaging/windows "$bundle/packaging"
          Compress-Archive -Path "$bundle/*" -DestinationPath "revoked-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: revoked-windows-x64
          path: app/revoked-windows-x64.zip

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Every APK must be signed to install at all; without secrets Flutter
      # falls back to a debug key the runner generates fresh each time.
      # That installs, but cannot update a previous install - and on this
      # app a reinstall wipes the identity private keys, which cannot be
      # regenerated. So the fallback artifact is named for testing only.
      - name: Write signing config
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - signing with an ephemeral debug key. The APK installs but cannot update an existing install."
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          echo "signed=true" >> $GITHUB_OUTPUT

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release

      - name: Name the artifact
        id: name
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            NAME="revoked-android.apk"
          else
            NAME="revoked-android-testing-only.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      # The keystore must not outlive the job, even on a failure path.
      - name: Remove signing material
        if: always()
        run: rm -f android/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: revoked-android
          path: app/${{ steps.name.outputs.name }}

  release:
    name: Attach to the release
    needs: [linux, windows, android]
    # Skipped on a manual run, which has no tag to attach to; the artifacts
    # are still on the run summary.
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # Immutable releases freeze assets at publish time, so the binaries
      # go onto the draft and publishing is the very last thing that
      # happens - nobody ever sees a release without its downloads.
      - name: Upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # A hand-pushed tag arrives with no release at all.
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
            IS_DRAFT=true
          fi
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::$TAG is already published and immutable - assets can no longer be attached. Cut a new release."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
