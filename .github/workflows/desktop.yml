name: Desktop builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        run: |
          BUNDLE=build/linux/x64/release/bundle
          cp -r packaging/linux "$BUNDLE/packaging"
          tar -C "$BUNDLE" -czf "revoked-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: revoked-linux-x64
          path: app/revoked-linux-x64.tar.gz

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item -Recurse packaging/windows "$bundle/packaging"
          Compress-Archive -Path "$bundle/*" -DestinationPath "revoked-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: revoked-windows-x64
          path: app/revoked-windows-x64.zip

  release:
    name: Attach to the release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
