name: Docs

# Publishes docs/ to GitHub Pages. Runs only when the docs (or this config)
# change, so ordinary code pushes never rebuild the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      # The reference pages are generated, not committed — zensical runs a
      # fixed set of plugins and no arbitrary MkDocs ones, so the spec is
      # rendered to Markdown here rather than by a renderer at build time.
      - run: python tools/docs/gen_api_reference.py
      - run: zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
