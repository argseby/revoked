name: Docs

# Publishes docs/ to GitHub Pages. Runs only when the docs (or this config)
# change, so ordinary code pushes never rebuild the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/docs/**"
      - "app/assets/icon/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      # The reference pages are generated, not committed — zensical runs a
      # fixed set of plugins and no arbitrary MkDocs ones, so the spec is
      # rendered to Markdown here rather than by a renderer at build time.
      - run: python tools/docs/gen_api_reference.py
      - run: mkdir -p docs/assets/brand && cp app/assets/icon/*.svg docs/assets/brand/
      - run: zensical build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
