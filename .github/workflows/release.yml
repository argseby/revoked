name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  repository-projects: write

jobs:
  release:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      app_changed: ${{ steps.app.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $TAG"

      - name: Determine version bump
        id: bump
        run: |
          LATEST=${{ steps.latest_tag.outputs.tag }}
          
          # Range safety for first run
          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            RANGE="${LATEST}..HEAD"
          else
            RANGE="HEAD"
          fi
          
          COMMITS=$(git log $RANGE --pretty=format:"%s")
          
          # No fix/feat/breaking in the range means nothing shippable
          # changed - docs/chore/ci pushes must not cut phantom releases.
          BUMP="none"
          if echo "$COMMITS" | grep -qiE "^breaking(\(.+\))?!?:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
            BUMP="patch"
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump level: $BUMP"

      # The build workflow counts as app code: a change to how the apps are
      # built has to run before it is trusted with a release.
      - name: Detect app changes
        id: app
        if: steps.bump.outputs.bump != 'none'
        run: |
          LATEST=${{ steps.latest_tag.outputs.tag }}
          CHANGED=true
          if git rev-parse "$LATEST" >/dev/null 2>&1 \
            && git diff --quiet "$LATEST" HEAD -- app/ .github/workflows/desktop.yml; then
            CHANGED=false
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "App changed: $CHANGED"

      - name: Calculate new version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          LATEST=${{ steps.latest_tag.outputs.tag }}
          BUMP=${{ steps.bump.outputs.bump }}
          
          VERSION=${LATEST#v}
          MAJOR=$(echo $VERSION | cut -d. -f1 || echo 0)
          MINOR=$(echo $VERSION | cut -d. -f2 || echo 0)
          PATCH=$(echo $VERSION | cut -d. -f3 || echo 0)
          
          if [ "$BUMP" = "major" ]; then
            if [ "$MAJOR" -eq 0 ]; then
              # DEV GUARD: Stay in 0.x.x range for breaking changes
              MINOR=$((MINOR + 1)); PATCH=0
            else
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            fi
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate changelog
        id: changelog
        if: steps.bump.outputs.bump != 'none'
        run: |
          LATEST=${{ steps.latest_tag.outputs.tag }}
          NEW=${{ steps.version.outputs.new_version }}
          DATE=$(date +%Y-%m-%d)
          
          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            RANGE="${LATEST}..HEAD"
          else
            RANGE="HEAD"
          fi
          
          echo "## ${NEW} (${DATE})" > NEW_ENTRY.md
          echo "" >> NEW_ENTRY.md
          
          git log $RANGE --pretty=format:"- %s" > all_commits.txt
          
          if grep -qiE "^- breaking" all_commits.txt; then
            echo "### ⚠️ Breaking Changes" >> NEW_ENTRY.md
            grep -iE "^- breaking" all_commits.txt >> NEW_ENTRY.md
            echo "" >> NEW_ENTRY.md
          fi
          
          if grep -qiE "^- feat" all_commits.txt; then
            echo "### ✨ Features" >> NEW_ENTRY.md
            grep -iE "^- feat" all_commits.txt >> NEW_ENTRY.md
            echo "" >> NEW_ENTRY.md
          fi
          
          if grep -qiE "^- fix" all_commits.txt; then
            echo "### 🐛 Bug Fixes" >> NEW_ENTRY.md
            grep -iE "^- fix" all_commits.txt >> NEW_ENTRY.md
            echo "" >> NEW_ENTRY.md
          fi

          if [ "${{ steps.app.outputs.changed }}" = "false" ]; then
            echo "> [!NOTE]" >> NEW_ENTRY.md
            echo "> The apps did not change in this release. Download them from the previous release." >> NEW_ENTRY.md
          fi


      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.bump.outputs.bump != 'none'
        with:
          go-version-file: go.mod

      # Attached when the release is created, before anything publishes it:
      # immutable releases freeze their assets at that moment.
      - name: Build revoked-mcp
        if: steps.bump.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          mkdir -p mcp
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/}
            EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags="-s -w -X revoked/util.releaseVersion=$VERSION" \
              -o "mcp/revoked-mcp-$GOOS-$GOARCH$EXT" ./cmd/revoked-mcp
          done
          (cd mcp && sha256sum revoked-mcp-* > revoked-mcp-sha256.txt)

      # What installed apps compare themselves against, at a URL that always
      # names the newest published release. A release without app changes
      # ships no app builds, so the newest app is carried over from the last
      # file, or is the previous tag before the first one existed.
      - name: Write version.json
        if: steps.bump.outputs.bump != 'none'
        env:
          NEW: ${{ steps.version.outputs.new_version }}
          LATEST: ${{ steps.latest_tag.outputs.tag }}
          APP_CHANGED: ${{ steps.app.outputs.changed }}
          REPO: ${{ github.repository }}
        run: |
          APP="$NEW"
          if [ "$APP_CHANGED" != "true" ]; then
            APP=$(curl -fsL "https://github.com/$REPO/releases/latest/download/version.json" | jq -r '.app // empty' || true)
            [ -n "$APP" ] || APP="$LATEST"
          fi
          jq -n --arg server "$NEW" --arg app "$APP" '{server: $server, app: $app}' > mcp/version.json
          cat mcp/version.json

      - name: Tag release
        if: steps.bump.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      # A draft when the apps are rebuilt: the repo uses immutable releases,
      # which freeze assets the moment a release is published, so the
      # desktop workflow uploads the binaries to this draft and publishes it
      # as its last step. With no app change there is nothing to attach, and
      # the release is published straight away.
      - name: Create release
        if: steps.bump.outputs.bump != 'none'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          body_path: NEW_ENTRY.md
          files: mcp/*
          draft: ${{ steps.app.outputs.changed == 'true' }}
          make_latest: true

  # The server ships as an image with the release stamped in, so a host that
  # pulls it (a Portainer stack) needs no source checkout and no .git.
  image:
    name: Server image
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Stamp source build version
        run: printf '%s\n' '${{ needs.release.outputs.version }}' > VERSION

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          # The build record is an artifact nobody reads, and it lands in the
          # same run as the app builds.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: REVOKED_VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apps:
    name: App builds
    needs: release
    if: needs.release.outputs.version != '' && needs.release.outputs.app_changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    # A called workflow gets none of the caller's secrets by default, so
    # without this the Android signing keys are empty on the release path
    # and every published APK falls back to a throwaway debug key.
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.version }}
