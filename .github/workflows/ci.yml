name: CI

# Runs on every PR and on pushes to the long-lived branches. The release
# workflow only tags and generates a changelog — nothing verified that the code
# built or that the tests passed before this existed.
on:
  pull_request:
  push:
    branches:
      - main
      - dev

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code; nothing here needs to write to the repo.
permissions:
  contents: read

# Pull requests from forks run untrusted code, so they go to a GitHub-hosted
# runner. Everything else (own branches, pushes) uses the self-hosted runner.
# This alone is not a guarantee — a fork PR can edit this file — so fork PR
# runs must also require approval in the repository's Actions settings.
jobs:
  go:
    name: Go — build, vet & test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The suite boots a real PocketBase instance on 127.0.0.1:5559 and drives
      # it over HTTP, so it needs no external services — but it does bind a
      # port, which is why it runs single-package-at-a-time (-p 1).
      - name: Test
        run: go test ./... -count=1 -p 1 -timeout 10m

  flutter:
    name: Flutter — analyze
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Flutter publishes no prebuilt SDK for Linux arm64, so flutter-action
      # cannot install it there. On that platform the stable branch is cloned
      # from git instead (Flutter fetches the matching arm64 Dart SDK on first
      # run). Every other runner — GitHub-hosted, macOS, x64 — uses the action.
      - name: Set up Flutter
        if: ${{ !(runner.os == 'Linux' && runner.arch == 'ARM64') }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Set up Flutter (Linux arm64, from git)
        if: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' }}
        working-directory: ${{ runner.temp }}
        run: |
          # Kept in the tool cache so a persistent runner clones only once.
          FLUTTER_HOME="${RUNNER_TOOL_CACHE:-$HOME/.cache}/flutter-stable"
          if [ -d "$FLUTTER_HOME/.git" ]; then
            git -C "$FLUTTER_HOME" fetch --tags origin stable
            git -C "$FLUTTER_HOME" checkout -B stable FETCH_HEAD
          else
            # Full clone: the tool derives its version from git tags.
            git clone -b stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" --disable-analytics
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
