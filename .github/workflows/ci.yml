name: CI

# Runs on every PR and on pushes to main after merging. The release
# workflow only tags and generates a changelog — nothing verified that the code
# built or that the tests passed before this existed.
on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code; nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  go:
    name: Go — build, vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # services/*.yaml are the Works with Revoked entries; the catalog the
      # app bundles must be what they build to.
      - name: Works with Revoked entries
        run: go run ./cmd/works-with check

      # TestJavaScriptSDK drives the SDK against the suite's server, and
      # TestSDKGeneratedFilesCurrent keeps its generated catalogues current.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/revoked-js/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: packages/revoked-js

      # The suite boots a real PocketBase instance on 127.0.0.1:5559 and drives
      # it over HTTP, so it needs no external services — but it does bind a
      # port, which is why it runs single-package-at-a-time (-p 1).
      - name: Test
        run: go test ./... -count=1 -p 1 -timeout 10m

  js-sdk:
    name: JavaScript SDK — check, test & package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: packages/revoked-js
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/revoked-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The published package must resolve for ESM, CJS and bundlers alike.
      - name: Lint package
        run: npm run lint:package

  flutter:
    name: Flutter — analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
