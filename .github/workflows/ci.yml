name: CI

# Runs on every PR and on pushes to the long-lived branches. The release
# workflow only tags and generates a changelog — nothing verified that the code
# built or that the tests passed before this existed.
on:
  pull_request:
  push:
    branches:
      - main
      - dev

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — build, vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The suite boots a real PocketBase instance on 127.0.0.1:5559 and drives
      # it over HTTP, so it needs no external services — but it does bind a
      # port, which is why it runs single-package-at-a-time (-p 1).
      - name: Test
        run: go test ./... -count=1 -p 1 -timeout 10m

  flutter:
    name: Flutter — analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
