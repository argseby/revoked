# Docs site. Every .md under docs/ becomes a page automatically — no
# registration step — and folders map 1:1 to URL paths:
#   docs/api/callbacks.md  ->  /api/callbacks/
# Navigation is generated from the folder tree; add a file and it appears.
site_name: Revoked
site_url: https://s-kiu.github.io/revoked/
repo_url: https://github.com/s-kiu/revoked
docs_dir: docs
# run.py (the webhook listener) owns 8000; the docs preview stays clear.
dev_addr: 127.0.0.1:8100

theme:
  name: material
  palette:
    # Follows the reader's system preference, with a manual toggle.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
